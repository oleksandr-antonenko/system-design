name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests, including ones from forks, run on GitHub's machines with a
# read-only token and no secrets. The server is never reachable from here:
# it pulls the `production` branch on its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://system-design.oleksandr-antonenko.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Lock file matches package.json
        run: |
          pnpm install --frozen-lockfile || {
            echo '::error::pnpm-lock.yaml is out of date with package.json.'
            echo 'Run "pnpm install" locally and commit the updated pnpm-lock.yaml.'
            exit 1
          }

      - name: Types, lint, tests
        run: pnpm check

      - name: Build
        run: pnpm build

  promote:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Move the production branch to this commit
        run: git push --force origin HEAD:refs/heads/production

  verify:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the site serves this commit
        run: |
          expected="${GITHUB_SHA::7}"
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            version=$(curl -fsS "$SITE_URL/api/health" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            if [ "$version" = "$expected" ]; then
              echo "Live: $SITE_URL serves $version"
              exit 0
            fi
            echo "Waiting: site reports '${version:-unreachable}', expecting $expected"
            sleep 10
          done
          echo "::error::$SITE_URL did not switch to $expected within 10 minutes. Check logs/deploy.log on the server."
          exit 1

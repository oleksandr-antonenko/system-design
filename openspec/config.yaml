schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Product: интерактивный курс по System Design. Слева теория по шагам, справа доска,
  на которой идёт визуальное сопровождение (живой трафик), задачи ученик решает руками
  на доске (балансировщики, кеши, очереди, кластеры). Макет: docs/mockups/lesson-load-balancer.html.
  Выбранная архитектура (гибрид, см. docs/plans/ и docs/roadmap.md):
  - урок = сценарий шагов; демонстрации автора и ходы ученика — один язык операций BoardOp;
    доска на шаге N = свёртка операций шагов 0..N;
  - симулятор потоков с фиксированным шагом (детерминированный, чистая функция);
  - проверка задач — декларативные цели (Schema-union) + запасной custom-чекер;
  - контент уроков — TS DSL, структура отдельно от текстов по языкам.

  Stack: pnpm workspace. apps/web — Foldkit (SPA, Vite, Tailwind) на Effect;
  apps/server — Node + Effect (HTTP, раздаёт сборку web и /api), better-auth, SQLite.
  Версии пинуются точно: effect 4.1.0 и @effect/* 4.1.0 по решению владельца проекта.
  foldkit 0.169.0 и @foldkit/* официально заявляют effect 4.0.0, поэтому 4.1.0 навязывается
  через pnpm overrides + peerDependencyRules; совместимость проверяется смоук-тестами.
  Соглашения Foldkit — FOLDKIT.md в apps/web (Model только из Schema, Message — факты в
  прошедшем времени, Commands для эффектов, никаких switch/for/let-итераций, Option вместо null).

  Languages: интерфейс и контент на uk, ru, en, lt. Язык — префикс URL (/uk/..., /ru/..., /en/..., /lt/...).
  Доменные функции (проверки, симулятор) возвращают коды и параметры, тексты собирает слой i18n.
  Полнота переводов интерфейса проверяется типами и тестами. Урок объявляет свои языки и полон
  в каждом из них; на остальных показывается на запасном языке (en) с пометкой.
  Курсы и уроки — самостоятельные модули: apps/web/src/courses/<курс>/ (course.ts, course.<язык>.ts)
  и apps/web/src/courses/<курс>/lessons/<NN>-<slug>/; реестр собирается автоматически.
  Адреса: /:язык/ — каталог, /:язык/:курс/ — карта курса, /:язык/:курс/lessons/:slug?step=N — урок.

  Open source: репозиторий публичный. Разработчики запускают проект локально без настройки
  (pnpm install && pnpm dev) и присылают уроки как самостоятельные модули через PR.
  Никаких адресов, портов, имён пользователей и других деталей сервера в репозитории —
  они живут вне его (заметки владельца, .env на сервере).

  Hosting: домашний сервер владельца, домен system-design.oleksandr-antonenko.com. Выкатка
  настроена вне репозитория: в нём нет CI, скриптов выкатки и планов выкатки. Перед
  слиянием в main pnpm check проходит локально.

  Tests: vitest (Story/Scene для Foldkit), запуск в тихом режиме: vitest run --silent --reporter=dot;
  tsc --noEmit --pretty false; oxlint.

rules:
  tasks:
    - Каждая задача заканчивается способом проверки (команда, тест или наблюдаемое поведение)
    - Тексты интерфейса добавляются сразу на всех четырёх языках (uk, ru, en, lt)

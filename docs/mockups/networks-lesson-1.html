<title>Сети: урок 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Unbounded:wght@500&display=swap">
<style>
/* Layout: учебник слева, сетевая доска справа, лента шагов сверху, транспорт пакета и поверхности (конверт, роутер, терминал, браузер) под доской */
:root {
  --bg: #EDF0EF;
  --page: #FAFBF9;
  --board: #F4F7F8;
  --grid: #E0E7EA;
  --ink: #17202A;
  --muted: #5A6774;
  --line: #D2DAE0;
  --node: #FFFFFF;
  --node-line: #8D9BA8;
  --accent: #2B4BD4;
  --accent-soft: #E2E7FB;
  --ok: #148A55;
  --warn: #C27C05;
  --bad: #CF3F36;
  --bad-soft: #FBE6E4;
  --ok-soft: #E0F3E9;
  --on-warn: #1A1406;
  --zone-home: #E9F0F5;
  --zone-net: #EEF0F4;
  --l-link: #0B7A85;
  --l-ip: #2B4BD4;
  --l-tp: #B0570C;
  --l-app: #A3318E;
  --p-dns: #7445C9;
  --p-tcp: #2B4BD4;
  --p-dhcp: #0B7A85;
  --term-bg: #121920;
  --term-ink: #DCE4EC;
  --term-dim: #7E8C99;
  --term-ok: #6BD39A;
  --term-acc: #9DB0FF;
  --term-bad: #FF8A80;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-prose: "Literata", "PT Serif", Georgia, serif;
  --f-ui: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --page: #131A21; --board: #0F151B; --grid: #1A232C; --ink: #E3E9EF; --muted: #93A0AD;
    --line: #27323C; --node: #18202A; --node-line: #536475; --accent: #8EA3FF; --accent-soft: #1E2850;
    --ok: #3DC48B; --warn: #E8AA3C; --bad: #F2675C; --bad-soft: #3A1715; --ok-soft: #12301F;
    --zone-home: #121C26; --zone-net: #141920;
    --l-link: #45C1CC; --l-ip: #8EA3FF; --l-tp: #F0A35E; --l-app: #E585D3;
    --p-dns: #B79BFF; --p-tcp: #8EA3FF; --p-dhcp: #45C1CC;
    --term-bg: #0A0F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --page: #131A21; --board: #0F151B; --grid: #1A232C; --ink: #E3E9EF; --muted: #93A0AD;
  --line: #27323C; --node: #18202A; --node-line: #536475; --accent: #8EA3FF; --accent-soft: #1E2850;
  --ok: #3DC48B; --warn: #E8AA3C; --bad: #F2675C; --bad-soft: #3A1715; --ok-soft: #12301F;
  --zone-home: #121C26; --zone-net: #141920;
  --l-link: #45C1CC; --l-ip: #8EA3FF; --l-tp: #F0A35E; --l-app: #E585D3;
  --p-dns: #B79BFF; --p-tcp: #8EA3FF; --p-dhcp: #45C1CC;
  --term-bg: #0A0F14;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-ui); font-size: .84em; background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- верхняя лента ---------- */
.top {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--page); border-bottom: 1px solid var(--line);
}
.crumb { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 10px; align-items: baseline; }
.crumb .brand { font-family: var(--f-display); font-weight: 500; font-size: 12.5px; color: var(--ink); }
.crumb b { color: var(--ink); font-weight: 600; }
.timeline { flex: 1 1 340px; display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 0; }
.tl-steps { display: flex; align-items: center; gap: 4px; }
.tl { appearance: none; border: 0; background: none; padding: 9px 0; cursor: pointer; display: grid; place-items: center; }
.tl .bar { display: block; width: 34px; height: 5px; border-radius: 3px; background: var(--line); transition: background .2s, height .2s; }
.tl.done .bar { background: var(--accent); opacity: .5; }
.tl.current .bar { background: var(--accent); height: 8px; }
.tl.is-task .bar { width: 11px; height: 11px; border-radius: 2px; transform: rotate(45deg); margin-inline: 5px; }
.tl.is-task.current .bar { height: 11px; }
.tl.is-quiz .bar { width: 13px; height: 13px; border-radius: 50%; margin-inline: 4px; background: transparent; border: 2.5px solid var(--line); }
.tl.is-quiz.done .bar { border-color: var(--accent); background: transparent; }
.tl.is-quiz.current .bar { height: 13px; border-color: var(--accent); background: var(--accent-soft); opacity: 1; }
.tl.is-quiz.first .bar { border-color: var(--ok); background: var(--ok); opacity: 1; }
.tl.is-quiz.shown .bar { border-color: var(--warn); background: transparent; opacity: 1; }
.tl:disabled { cursor: not-allowed; }
.tl-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tl-label b { color: var(--ink); font-weight: 600; }
.top-note { font-size: 10.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

/* ---------- раскладка ---------- */
.main { display: grid; grid-template-columns: minmax(340px, 38%) minmax(0, 1fr); min-height: 0; }

.theory { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--page); border-right: 1px solid var(--line); }
.theory-scroll {
  position: relative; flex: 1; overflow-y: auto;
  padding-block: 26px 32px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: 28px;
}
.eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: 23px; line-height: 1.22; margin: 8px 0 6px; text-wrap: balance; letter-spacing: -.01em; }
.meta { font-size: 12px; color: var(--muted); }
.lesson-head { padding-bottom: 18px; }

.beat { padding-block: 18px; border-top: 1px solid var(--line); }
.beat h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
.beat h2 .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.beat.past { opacity: .5; cursor: pointer; transition: opacity .15s; }
.beat.past:hover { opacity: .8; }
.beat.past .prose { font-size: 15px; }
.prose { font-family: var(--f-prose); font-size: 16.5px; line-height: 1.62; max-width: 62ch; }
.prose p { margin: 0; }
.prose p + p { margin-top: .75em; }
.prose strong { font-weight: 600; }
.ref { font-weight: 600; border-bottom: 1.5px dashed var(--accent); cursor: help; border-radius: 2px; }
.ref:hover, .ref:focus-visible, .ref.on { background: var(--accent-soft); }
.ref.env-link { border-bottom-color: var(--l-link); }
.ref.env-ip { border-bottom-color: var(--l-ip); }
.ref.env-tcp { border-bottom-color: var(--l-tp); }
.ref.env-http { border-bottom-color: var(--l-app); }
.ref.act { cursor: pointer; }
.simpl { display: inline-block; font-family: var(--f-ui); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 0 6px; vertical-align: 2px; }
.task-done { margin: 12px 0 0; font-size: 12px; color: var(--ok); font-weight: 600; }
.task-done.shown { color: var(--warn); }
.finish { margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.finish p { margin: 0; font-family: var(--f-prose); font-size: 15.5px; }
.ask-ai { border: 1px solid var(--line); border-radius: 12px; background: var(--node); padding: 14px 16px; display: grid; gap: 8px; }
.ask-ai .eyebrow { color: var(--accent); font-weight: 600; }
.ask-ai blockquote { margin: 0; font-family: var(--f-prose); font-size: 15px; line-height: 1.55; border-left: 3px solid var(--accent); padding-left: 12px; }
.ask-ai .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }

/* ---------- карточки задачи и вопроса ---------- */
.task { margin-top: 16px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--node); padding: 16px; display: grid; gap: 12px; }
.task.solved { border-color: var(--ok); }
.task.revealed { border-color: var(--warn); }
.task-head { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.task.solved .task-head { color: var(--ok); }
.task.revealed .task-head { color: var(--warn); }
.task-head .dia { width: 9px; height: 9px; background: currentColor; transform: rotate(45deg); border-radius: 1px; flex: none; }
.task-head .ring { width: 11px; height: 11px; border: 2.5px solid currentColor; border-radius: 50%; flex: none; }
.task-head .att { margin-left: auto; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: none; }
.task-goal { font-family: var(--f-prose); font-size: 16px; line-height: 1.5; font-weight: 600; margin: 0; }
.task-how { font-size: 12px; color: var(--muted); margin: 0; }
.remember { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12px; background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; }
.remember dt { color: var(--muted); }
.remember dd { margin: 0; font-weight: 600; }
.remember .cap { grid-column: 1 / -1; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; align-items: start; }
.checks .mk { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--node-line); display: grid; place-items: center; font-size: 10px; line-height: 1; margin-top: 1px; font-weight: 700; transition: background .25s, border-color .25s; }
.checks li.ok .mk { background: var(--ok); border-color: var(--ok); color: var(--page); }
.checks li.fail .mk { background: var(--bad); border-color: var(--bad); color: var(--page); }
.checks li.wait .mk { border-style: dashed; border-color: var(--accent); }
.checks .why { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.checks li.fail .why { color: var(--bad); }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.fb.fail { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.fb p { margin: 0; }
.fb p + p { margin-top: 6px; }
.explain { font-family: var(--f-prose); font-size: 15px; line-height: 1.5; margin: 0; }
.mark { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; justify-self: start; }
.mark.first { color: var(--ok); background: var(--ok-soft); }
.mark.shown { color: var(--warn); border: 1px solid var(--warn); }
.hints { margin: 0; padding-left: 20px; font-size: 12.5px; display: grid; gap: 4px; }
.hints li::marker { color: var(--accent); }
.task-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.result { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.result dt { color: var(--muted); }
.result dd { margin: 0; font-weight: 600; }

/* ---------- кнопки ---------- */
.btn { appearance: none; border: 1px solid var(--line); background: var(--node); color: var(--ink); border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--node-line); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--page); font-weight: 600; }
.btn.link { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 4px; }
.btn.sm { padding: 4px 9px; font-size: 11.5px; }

.theory-nav {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: 28px;
  border-top: 1px solid var(--line); background: var(--page);
}
.theory-nav .nav-text { font-size: 11.5px; color: var(--muted); text-align: center; flex: 1; min-width: 0; }

/* ---------- доска ---------- */
.boardside { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage {
  position: relative; flex: 1; min-height: 240px; overflow: hidden;
  background-color: var(--board);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.flash { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 5px var(--ok); } 100% { box-shadow: inset 0 0 0 0 var(--ok); } }
.mode-chip { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--page); border: 1px solid var(--line); color: var(--muted); pointer-events: none; }
.mode-chip.edit { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.mode-chip.quiz { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.toast { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(460px, calc(100% - 24px)); background: var(--ink); color: var(--page); border-radius: 10px; padding: 9px 14px; font-size: 12.5px; z-index: 5; }

#board text { pointer-events: none; }
#board .zone { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }
#board .zone.home { fill: var(--zone-home); }
#board .zone.net { fill: var(--zone-net); }
#board .zone-label { font: 600 10px var(--f-ui); letter-spacing: .1em; fill: var(--muted); }
#board .zone-label tspan.addr { font-weight: 500; letter-spacing: .02em; }
#board .link { fill: none; stroke: var(--node-line); stroke-width: 2; stroke-linecap: round; transition: stroke .25s; }
#board .link.radio { stroke-width: 1.8; stroke-dasharray: 4 3.5; }
#board .link.lit { stroke: var(--accent); stroke-width: 2.6; }
#board .link.cur { stroke-width: 3.4; }
#board .link.dim { opacity: .35; }
#board .link.new { animation: draw 1.1s ease-out; }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
#board .link-hl { fill: none; stroke: var(--l-link); stroke-width: 10; stroke-opacity: .28; stroke-linecap: round; pointer-events: none; }
#board .no-link { fill: none; stroke: var(--bad); stroke-width: 2.4; stroke-dasharray: 7 6; animation: dash 1s linear infinite; pointer-events: none; }
@keyframes dash { to { stroke-dashoffset: -26; } }
#board .tag rect { fill: var(--page); stroke: var(--line); }
#board .tag text { font: 500 10px var(--f-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
#board .tag.nat rect { stroke: var(--l-ip); }
#board .tag.nat text { fill: var(--l-ip); font-weight: 600; }
#board .node .body { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; transition: stroke .2s; }
#board .node.cloud .body { fill: var(--page); }
#board .node.hl .body, #board .node.ref-hover .body { stroke: var(--accent); stroke-width: 2.5; }
#board .node.off .body { stroke-dasharray: 5 4; }
#board .node.off .icon, #board .node.off .title { opacity: .55; }
#board .node.appear { animation: appear .5s ease-out both; }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#board .icon { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#board .title { font: 600 12.5px var(--f-ui); fill: var(--ink); }
#board .sub { font: 400 11px var(--f-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
#board .cand { cursor: pointer; }
#board .cand:focus { outline: none; }
#board .cand .body { stroke: var(--accent); stroke-width: 2; }
#board .cand:hover .body, #board .cand:focus-visible .body { stroke-width: 3; fill: var(--accent-soft); }
#board .halo { fill: none; stroke-width: 3; pointer-events: none; }
#board .halo.pulse { animation: pulse 1.4s ease-in-out infinite; }
#board .halo.info { stroke: var(--accent); }
#board .halo.ok { stroke: var(--ok); }
#board .halo.bad { stroke: var(--bad); }
#board .halo.warn { stroke: var(--warn); }
@keyframes pulse { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: 1; } }
#board .ann { pointer-events: none; }
#board .ann rect { fill: var(--ink); }
#board .ann text { font: 600 11px var(--f-ui); fill: var(--page); }
#board .ann .stem { stroke: var(--ink); stroke-width: 1.5; }
#board .ann.bad rect { fill: var(--bad); }
#board .ann.bad .stem { stroke: var(--bad); }
#board .ann.ok rect { fill: var(--ok); }
#board .ann.ok .stem { stroke: var(--ok); }
#board .ann.info rect { fill: var(--accent); }
#board .ann.info .stem { stroke: var(--accent); }
#board .ann.warn rect { fill: var(--warn); }
#board .ann.warn text { fill: var(--on-warn); }
#board .ann.warn .stem { stroke: var(--warn); }
#board .ring { fill: none; stroke-width: 1.5; stroke-dasharray: 3 5; pointer-events: none; }
#board .ring.b5 { stroke: var(--l-app); }
#board .ring.b24 { stroke: var(--l-link); }
#board .ring-fill.b5 { fill: var(--l-app); fill-opacity: .05; }
#board .ring-fill.b24 { fill: var(--l-link); fill-opacity: .05; }
#board .ring-label { font: 600 10px var(--f-ui); }
#board .ring-label.b5 { fill: var(--l-app); }
#board .ring-label.b24 { fill: var(--l-link); }
#board .port { fill: var(--page); stroke: var(--accent); stroke-width: 2; cursor: crosshair; }
#board .port:hover, #board .port.armed { fill: var(--accent); }
#board .port-label { font: 600 9.5px var(--f-ui); fill: var(--accent); letter-spacing: .06em; }
#board .plug { cursor: grab; touch-action: none; }
#board .port { touch-action: none; }
#board .plug rect { fill: var(--node-line); }
#board .plug.armed rect { fill: var(--accent); }
#board .loose { fill: none; stroke: var(--node-line); stroke-width: 2; stroke-linecap: round; }
#board .ghost-edge { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; pointer-events: none; }
#board .rubber { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
#board .pkt { cursor: pointer; }
#board .pkt .hit { fill: transparent; }
#board .pkt .env { stroke: var(--page); stroke-width: 1.4; }
#board .pkt .flap { fill: none; stroke: var(--page); stroke-width: 1.3; stroke-linejoin: round; }
#board .pkt.sel .env { stroke: var(--ink); stroke-width: 2; }
#board .pkt.dropped { opacity: .45; }
#board .pkt-ring { fill: none; stroke-width: 2; pointer-events: none; }

/* ---------- транспорт пакета ---------- */
.transport {
  background: var(--page); border-top: 1px solid var(--line);
  padding-block: 9px 10px;
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 7px;
}
.t-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.t-row .sep { width: 1px; height: 22px; background: var(--line); margin-inline: 4px; }
.tbtn { appearance: none; border: 1px solid var(--line); background: var(--node); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbtn:hover:not(:disabled) { border-color: var(--node-line); }
.tbtn:disabled { opacity: .42; cursor: not-allowed; }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--page); font-weight: 600; min-width: 92px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  wan: false, wifi: { ...FACTORY }, draft: { ...FACTORY },
  dhcp: { on: true, from: '192.168.1.20', to: '192.168.1.99' }, dhcpDraft: { on: true, from: '192.168.1.20', to: '192.168.1.99' },
  assoc: false, phoneIp: null, reached: false, solved: false, help: false, fails: 0,

// ---------- проигрыватель трассы: дискретные хопы, пауза на каждом ----------
const PL = {

    wait: o.delay ?? 500, pauseAt: o.pauseAt ?? null, stopAfter: null, counter: o.counter || 'hop',
    locked: !!o.locked, onStop: o.onStop || null, onEnd: o.onEnd || null, sel: false,

}

}

}

}

// ---------- сцена шага ----------
function enterStep(i) {
  S.step = i;
  S.maxStep = Math.max(S.maxStep, i);
  S.gesture = null; S.armed = null; S.envHl = null;
  $('rubber').setAttribute('d', '');
  if (i === 0) { load([]); S.tab = 'browser'; }
  else if (i === 1) { load(T_DNS, { autoplay: true, delay: 700, dwell: 500 }); S.tab = 'browser'; }
  else if (i === 2) { load(T_HTTP, { autoplay: true, delay: 700, dwell: 900 }); S.tab = 'browser'; }
  else if (i === 3) { const q = S.quiz['first-hop']; load(T_HTTP, { at: q ? 1 : 0, locked: !q }); }
  else if (i === 4) { load(T_HTTP, { autoplay: !reduce, at: reduce ? 1 : 0, pauseAt: 1, delay: 500 }); S.tab = 'env'; }
  else if (i === 5) { const q = S.quiz['which-layer']; load(T_HTTP, { at: 1, locked: !q }); S.tab = 'env'; }
  else if (i === TASK) { load(T.solved ? taskTrace().hops : [], { at: T.solved ? 999 : 0 }); if (T.solved) PL.stop = NH(); S.tab = 'router'; }
  else if (i === 7) {
    S.summaryDone = false;
    load(T_FULL, { autoplay: true, delay: 600, fly: 420, dwell: 80, counter: 'packet', onEnd: () => { S.summaryDone = true; renderCard(); } });
    S.tab = 'browser';
  }
  if (i === 1 && S.maxStep === 1 && !S.seenDns) { S.appear = 'dns'; S.seenDns = true; }
}

function net() {
  const i = S.step, task = i >= TASK;
  const devices = ['phone', 'laptop', 'router', 'internet', 'shop'];
  if (i >= 1) devices.push('dns');
  const links = [];
  if (!task || T.assoc) links.push({ id: 'phone-router', m: 'radio' });
  links.push({ id: 'laptop-router', m: task ? 'cable' : 'radio' });
  if (!task || T.wan) links.push({ id: 'router-internet', m: 'cable' });
  if (i >= 1) links.push({ id: 'internet-dns', m: 'cable' });
  links.push({ id: 'internet-shop', m: 'cable' });
  return { devices, links, kitchen: task, rings: i === TASK && !T.solved, loose: task && !T.wan };
}

// ---------- геометрия доски ----------
const svg = $('board');
let NET = net();
const LAY = () => LAYOUTS[S.layout];

function posOf(id) { return id === 'phone' && NET.kitchen ? LAY().kitchen : LAY().pos[id]; }
function edgePt(id, tx, ty, pad = 3) {
  const [cx, cy] = posOf(id), [w, h] = SIZE[id], dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return [cx, cy];
  if (id === 'internet') {
    const rx = 86 + pad, ry = 34 + pad, k = 1 / Math.sqrt(dx * dx / (rx * rx) + dy * dy / (ry * ry));
    return [cx + dx * k, cy + dy * k];
  }

}

  return [edgePt(a, pb[0], pb[1], pad), edgePt(b, pa[0], pa[1], pad)];
}
const P = p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;

  const e = [c0[0] + (pp[0] - c0[0]) * 0.42, c0[1] + (pp[1] - c0[1]) * 0.42];

  return { c0, e: [e[0] + droop[0], e[1] + droop[1]], ctl: [(c0[0] + e[0]) / 2 + droop[0] * .2, (c0[1] + e[1]) / 2 + droop[1] * 1.3 + (S.layout === 'wide' ? 0 : 0)] };
}

// ---------- что показывает доска на этом шаге ----------
function marks() {
  const ann = {}, halo = {}, cands = [], noLink = [];
  const i = S.step, ch = curHop();
  if (i === 0) ann.phone = ['вы здесь', 'info'];
  if (i === 1 && PL.stop >= NH()) ann.phone = ['shop.example = 198.51.100.10', 'ok'];
  if (i === 2 && PL.stop >= NH()) ann.phone = ['страница получена', 'ok'];
  if (i === 3) {
    const q = S.quiz['first-hop'], Q = QUIZ['first-hop'];

    else {

      ann.router = [q.pick === 'router' ? 'верно: шлюз' : 'правильный ответ', 'ok'];
      if (q.pick !== 'router') {

function nodeSvg(id, o) {

function litLinks() {
  const lit = new Set();
  let cur = null;

  if (PL.phase === 'fly' && PL.trace[PL.stop]) { cur = PL.trace[PL.stop].link; lit.add(cur); }

function renderBoard() {

  $('g-zones').innerHTML = `<rect class="zone home" x="${hx}" y="${hy}" width="${hw}" height="${hh}" rx="16"/>
    <rect class="zone net" x="${nx}" y="${ny}" width="${nw}" height="${nh}" rx="16"/>
    <text class="zone-label" x="${hx + 14}" y="${hy + 18}">ДОМ <tspan class="addr">· 192.168.1.0/24</tspan></text>
    <text class="zone-label" x="${nx + 14}" y="${ny + 18}">ИНТЕРНЕТ</text>`;

  // кольца Wi-Fi в задаче: какой диапазон докуда достаёт

  if (NET.rings) {

    show.forEach(k => {

    });
  }
  $('g-rings').innerHTML = rings;

  const { ann, halo, cands, noLink } = marks();
  const { lit, cur } = litLinks();
  const ch = curHop();
  let L = '';
  noLink.forEach(([a, b]) => {
    const pa = posOf(a), pb = posOf(b);

  });

    const [p0, p1] = linkEnds(l.id), radio = l.m === 'radio';

  if ((S.envHl === 'tp' || S.envHl === 'app') && ch) hl.add(serverOf(ch.h));
  const editTask = S.step === TASK && !T.solved && !T.demo;
  let N = '';
  NET.devices.forEach((id, k) => {
    const appear = S.appear === 'all' || (S.appear === 'dns' && id === 'dns');
    const o = { hl: hl.has(id), appear, delay: S.appear === 'all' ? k * 170 + 80 : 0 };
    if (cands.includes(id)) { o.cand = true; o.focus = DEV[id].title; }
    if (id === 'phone' && S.step >= TASK) {
      if (!T.assoc) { o.off = true; o.sub = ['нет сети']; }

    }

    O += S.layout === 'wide' ? `<text class="sub" x="${kx + w / 2 + 8}" y="${ky + 4}">кухня, за двумя стенами</text>` : `<text class="sub" x="${kx - w / 2 + 4}" y="${ky + h / 2 + 16}">кухня</text>`;

    const lbl = S.layout === 'wide' ? [pp[0] + 10, pp[1] - 12] : [pp[0] + 12, pp[1] + 4];

    if (editTask) O += `<circle class="port${S.armed === 'port' ? ' armed' : ''}" cx="${pp[0]}" cy="${pp[1]}" r="8" data-port="router" tabindex="0" role="button" aria-label="Порт WAN роутера: потяните кабель к облаку"><title>Порт WAN: потяните отсюда к облаку «Интернет»</title></circle>`;

    $('g-pkt').innerHTML = `<g class="pkt${PL.sel ? ' sel' : ''}${ch.arrived && ch.h.drop ? ' dropped' : ''}" id="pkt" data-pkt="1" tabindex="0" role="button" aria-label="Пакет ${esc(ch.h.label)}: открыть конверт">
      ${PL.sel ? '<circle class="pkt-ring" r="17" style="stroke:var(--ink)"/>' : ''}
      <circle class="hit" r="20"/><rect class="env" x="-12" y="-8.5" width="24" height="17" rx="3" style="fill:${color}"/><path class="flap" d="M-11,-7.5 L0,1.5 L11,-7.5"/>
      <title>${esc(ch.h.label)} · нажмите, чтобы открыть конверт</title></g>`;
    placePacket();

}

function envDevices(h) {
  const ip = h.env.find(l => l.k === 'ip');
  const who = v => v === A.phone.ip ? 'phone' : v === A.routerWan.ip || v === A.routerLan.ip ? 'router' : v === A.dns.ip ? 'dns' : v === A.shop.ip ? 'shop' : null;

}

  let d = t * total;
  for (let k = 0; k < seg.length; k++) {
    if (d <= seg[k] || k === seg.length - 1) { const r = seg[k] ? clamp(d / seg[k], 0, 1) : 1; return [pts[k][0] + (pts[k + 1][0] - pts[k][0]) * r, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * r]; }
    d -= seg[k];
  }
  return pts[pts.length - 1];
}
function packetXY() {
  if (!NH()) return null;
  if (PL.phase === 'fly') {
    const t = PL.t < .5 ? 2 * PL.t * PL.t : 1 - Math.pow(-2 * PL.t + 2, 2) / 2;
    return along(hopPts(PL.stop), t);
  }
  if (PL.stop === 0) return hopPts(0)[0];
  const p = hopPts(PL.stop - 1);
  return p[p.length - 1];
}
function placePacket() {
  const g = $('pkt'), p = packetXY();
  if (g && p) g.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
}

function canGo(i) {

}

function taskGoals() {

}

// ---------- транспорт и подпись к хопу ----------
function caption() {
  const i = S.step;
  if (i === 3 && !S.quiz['first-hop']) return ['info', 'Вопрос', 'На какое устройство пакет попадёт первым? Кликните его на доске.'];
  if (i === 5 && !S.quiz['which-layer']) return ['info', 'Вопрос', 'В конверте подсвечено поле 443. Какой это слой? Варианты под конвертом.'];
  const ch = curHop();
  if (!ch) {
    if (i === 0) return ['', 'Пакетов пока нет', 'Это схема вашей сети. Пакеты побегут на следующем шаге.'];
    if (T.solved) return ['ok', 'Готово', 'Страница открылась.'];
    if (!T.assoc) return ['bad', 'Телефон не в сети', 'Он помнит только сеть «Дом» и не видит её. Пакетам некуда идти.'];
    return ['', 'Телефон в сети', 'Обновите страницу в браузере телефона.'];
  }
  const h = ch.h, dot = `var(--p-${h.proto})`, route = `${NAME(h.from)} → ${NAME(h.to)}`;
  if (ch.atStart) return [dot, `${h.label} · готов к отправке`, 'Нажмите «▶ Пуск» или «шаг ▶». Пакет можно нажать, чтобы открыть конверт.'];
  if (ch.arrived && h.drop) return ['bad', `${h.label} · потерян: ${h.to === 'router' ? 'роутер' : NAME(h.to)} дальше не передал`, h.note];
  if (ch.arrived && PL.stop >= NH()) {
    if (S.step === 7) return ['ok', 'Доставлено', 'Пакетов 9, у каждого 3 хопа, всего 192 мс. На сервере 200 OK.'];
    return ['ok', `Доставлено · ${route}`, h.note];
  }
  return [dot, `${h.label} · ${route}`, h.note];
}

function renderTransport() {
  const n = NH(), has = n > 0, lock = PL.locked, atStart = PL.stop === 0 && PL.phase === 'rest';
  $('t-first').disabled = !has || lock || atStart;
  $('t-back').disabled = !has || lock || atStart;
  $('t-play').disabled = !has || lock;
  $('t-step').disabled = !has || lock || PL.stop >= n;
  $('t-play').textContent = PL.playing ? '❚❚ Пауза' : has && PL.stop >= n ? '↻ Ещё раз' : '▶ Пуск';
  document.querySelectorAll('[data-speed]').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.speed === PL.speed)); });
  let cnt = '';
  if (has) {
    const shown = PL.phase === 'fly' ? PL.stop + 1 : PL.stop;
    if (PL.counter === 'packet') {
      const ch = curHop(), ids = [...new Set(PL.trace.map(x => x.pkt))];
      const p = ch.atStart ? 0 : ids.indexOf(ch.h.pkt) + 1;
      cnt = `пакет <b>${p}</b> из ${ids.length} · хоп <b>${ch.atStart ? 0 : ch.h.j + 1}</b> из 3`;
    } else cnt = `хоп <b>${shown}</b> из ${n}`;
  } else cnt = 'хоп — из —';
  $('t-count').innerHTML = cnt;
  const [tone, where, what] = caption();
  const c = $('t-caption');
  c.className = 't-caption' + (tone === 'bad' ? ' bad' : tone === 'ok' ? ' ok' : '');
  const bg = tone === 'bad' ? 'var(--bad)' : tone === 'ok' ? 'var(--ok)' : tone === 'info' ? 'var(--accent)' : tone || 'var(--node-line)';
  c.innerHTML = `<span class="dot" style="background:${bg}"></span><span class="where">${esc(where)}</span><span class="what">${esc(what)}</span>`;

// ---------- конверт ----------
function envChanges(h, prev) {
  if (!prev) {
    const n = h.env.map(l => l.name).reverse(), pairs = [];
    for (let k = 0; k < n.length - 1; k++) pairs.push(k ? `${n[k]} в ${k === n.length - 2 ? 'кадр ' : ''}${n[k + 1]}` : `${n[k]} положили в ${n[k + 1]}`);
    return `Собран у отправителя: ${pairs.join(', ')}.`;
  }
  const out = [], g = (e, f) => { for (const l of e.env) for (const x of l.fields) if (x.f === f) return x.v; return null; };
  const L0 = prev.env[0], L1 = h.env[0];
  out.push(L0.name !== L1.name ? `<b>новый кадр</b> ${L0.name} → ${L1.name}` : '<b>новый кадр</b>: сменились MAC-адреса');
  if (g(prev, 'ip.src') !== g(h, 'ip.src')) out.push(`<b>NAT</b> отправитель ${g(prev, 'ip.src')}:${g(prev, 'tp.sport')} → ${g(h, 'ip.src')}:${g(h, 'tp.sport')}`);
  if (g(prev, 'ip.dst') !== g(h, 'ip.dst')) out.push(`<b>NAT</b> получатель ${g(prev, 'ip.dst')}:${g(prev, 'tp.dport')} → ${g(h, 'ip.dst')}:${g(h, 'tp.dport')}`);
  out.push(`TTL ${g(prev, 'ip.ttl')} → ${g(h, 'ip.ttl')}`);
  const same = [];
  if (g(prev, 'ip.dst') === g(h, 'ip.dst')) same.push(`IP получателя ${g(h, 'ip.dst')}`);
  if (g(prev, 'tp.dport') === g(h, 'tp.dport')) same.push(`порт ${g(h, 'tp.dport')}`);
  if (h.env[3]) same.push(h.env[3].name);
  return out.join(' · ') + (same.length ? `. Не изменились: ${same.join(', ')}.` : '.');
}

function layerHtml(h, prev, idx, fresh) {
  const L = h.env[idx];
  if (!L) return '';
  const PLy = prev && prev.env.find(x => x.k === L.k);
  const q = S.step === 5 ? S.quiz['which-layer'] : null;
  let cls = `layer k-${L.k}`, changed = false;
  if (S.envHl === L.k) cls += ' hl';
  if (q) { if (L.k === QUIZ['which-layer'].answer) cls += ' good'; else if (L.k === q.pick) cls += ' wrong'; }
  const fields = L.fields.map(f => {
    const pf = PLy && PLy.fields.find(x => x.f === f.f), ch = pf && pf.v !== f.v;
    if (ch) changed = true;
    const ask = S.step === 5 && f.f === 'tp.dport';
    return `<span class="fld${ch ? ' changed' : ''}${ask ? ' ask' : ''}${ask && q ? ' done' : ''}" data-f="${f.f}"><span class="k">${esc(f.k)}</span>${ch ? `<span class="was">${esc(pf.v)}</span>→` : ''}<span class="v">${esc(f.v)}</span>${ch && f.nat ? '<span class="badge">NAT</span>' : ''}</span>`;
  }).join('');
  let badge = '';
  if (L.k === 'link' && PLy) { badge = `<span class="lbadge">${PLy.name !== L.name ? 'новый кадр' : 'новые MAC'}</span>`; changed = true; }
  if (L.note) badge += `<span class="fld"><span class="k">${esc(L.note)}</span></span>`;
  if (fresh && changed) cls += ' fresh';
  return `<div class="${cls}" data-layer="${L.k}"><div class="lrow"><span class="lname">${esc(L.name)}<small>${LAYER_SMALL[L.k]}</small></span>${fields}${badge}</div>${layerHtml(h, prev, idx + 1, fresh)}</div>`;
}

let envKey = '';
function renderEnv() {
  const pane = $('pane-env');
  if (pane.hidden) return;
  const ch = curHop();
  if (!ch) {
    pane.innerHTML = `<div class="pane-empty"><b>Конверт пуст</b><span>Конверт показывает слои пакета на текущем хопе: кадр Wi-Fi или Ethernet, IP, TCP или UDP и данные приложения. Пакеты появятся со второго шага. Нажмите на любой, и его конверт откроется здесь.</span></div>`;
    envKey = '';
    return;
  }
  const h = ch.h, prev = ch.i > 0 && PL.trace[ch.i - 1].pkt === h.pkt ? PL.trace[ch.i - 1] : null;
  const key = `${S.step}:${ch.i}`, fresh = key !== envKey && envKey !== '';
  envKey = key;
  const state = ch.atStart ? 'ещё у отправителя' : PL.phase === 'fly' ? 'в пути' : h.drop ? 'потерян' : `у получателя: ${NAME(h.to)}`;
  let html = `<div class="env-head"><span class="pk"><i style="background:var(--p-${h.proto})"></i><span class="ttl">${esc(h.label)}</span></span>
      <span>хоп ${h.j + 1} из ${h.n} · ${NAME(h.from)} → ${NAME(h.to)} · ${state}</span></div>
    <div class="env-head"><span class="chg">${envChanges(h, prev)}</span></div>
    <div class="env${S.envHl ? ' fade' : ''}">${layerHtml(h, prev, 0, fresh)}</div>`;

function runCmd(raw) {
  const cmd = raw.trim().replace(/\s+/g, ' ');
  if (!cmd) return;
  TERM.hist.push(cmd); TERM.hi = TERM.hist.length;
  tp('cmd', cmd);
  const [c, ...args] = cmd.split(' '), arg = args.filter(a => !a.startsWith('-')).pop();
  const ifn = wired() ? 'en1' : 'en0';
  if (c === 'clear') { TERM.lines = []; }
  else if (c === 'help') tp('dim', 'Доступно: ip a (или ipconfig), ping <адрес или имя>, nslookup <имя>, arp -a, clear.');
  else if ((c === 'ip' && /^a(ddr)?$/.test(args[0] || '')) || c === 'ipconfig' || c === 'ifconfig') {
    if (c !== 'ip') tp('dim', `# ${c} — синоним ip a: формат вывода в курсе один, упрощённый`);
    tp('o', 'lo0: inet 127.0.0.1/8');
    tp('o', `${ifn}: ${wired() ? 'Ethernet' : 'Wi-Fi "Дом"'}  status: active`);
    tp('o', '     inet 192.168.1.42/24  brd 192.168.1.255');
    tp('o', '     ether 3c:22:fb:7e:00:42');
    tp('o', '     gateway 192.168.1.1  dns 192.0.2.10');
  } else if (c === 'ping') {
    if (!arg) tp('o', 'usage: ping <адрес или имя>');
    else {
      let ip = arg, name = null;
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(arg)) {
        if (arg === 'localhost') ip = '127.0.0.1';
        else if (arg === 'shop.example' && inetUp()) ip = A.shop.ip;
        else { tp('o', `ping: cannot resolve ${arg}: Unknown host`); if (!inetUp()) tp('dim', '# DNS-резолвер недоступен: у роутера не подключён WAN.'); ip = null; }
        name = arg;
      }
      if (ip) {
        const t = pingTarget(ip);
        tp('o', `PING ${name || ip} (${ip}): 56 data bytes`);
        for (let k = 0; k < 3; k++) tp(t ? 'o' : 'bad', t ? `64 bytes from ${ip}: icmp_seq=${k} ttl=${t.ttl} time=${t.rtt.toFixed(t.rtt < 1 ? 3 : 1)} ms` : `Request timeout for icmp_seq ${k}`);
        tp('o', `--- ${name || ip} ping statistics ---`);
        tp('o', `3 packets transmitted, ${t ? 3 : 0} packets received, ${t ? '0.0' : '100.0'}% packet loss`);
        if (!t && (ip === A.dns.ip || ip === A.shop.ip) && !inetUp()) tp('dim', '# Дальше роутера пакеты не уходят: кабель WAN не подключён.');
        else if (!t && ip === A.phone.ip) tp('dim', '# Телефона нет в сети.');
        else if (!t) tp('dim', '# На доске нет устройства с таким адресом.');
        if (t && t.path.length) flashPath(t.path);
      }
    }
  } else if (c === 'nslookup') {
    if (!arg) tp('o', 'usage: nslookup <имя>');
    else if (!inetUp()) { tp('bad', ';; connection timed out; no servers could be reached'); tp('dim', '# Резолвер 192.0.2.10 за роутером, а WAN не подключён.'); }
    else {
      tp('o', 'Server:\t\t192.0.2.10');
      tp('o', 'Address:\t192.0.2.10#53');
      tp('o', '');
      if (arg === 'shop.example') { tp('o', 'Non-authoritative answer:'); tp('o', 'Name:\tshop.example'); tp('acc', 'Address: 198.51.100.10'); }
      else tp('bad', `** server can't find ${arg}: NXDOMAIN`);
      flashPath(['laptop-router', 'router-internet', 'internet-dns']);
    }
  } else if (c === 'arp' && args[0] === '-a') {
    tp('o', `? (192.168.1.1) at a4:91:b1:00:00:01 on ${ifn} [ethernet]`);
    if (phoneUp()) tp('o', `? (192.168.1.23) at 3c:22:fb:4a:10:23 on ${ifn} [ethernet]`);
  } else tp('dim', `Команды «${c}» в этом уроке нет. Доступно: ip a, ipconfig, ping, nslookup, arp -a, clear.`);
  termRender();
}

// ---------- общий рендер ----------
let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function renderModeChip() {
  const c = $('mode-chip'), st = STEPS[S.step];
  let t = 'Доска следует за текстом', k = '';
  if (st.quiz && !S.quiz[st.quiz]) { t = st.quiz === 'first-hop' ? 'Вопрос · кликните устройство' : 'Вопрос · выберите слой'; k = 'quiz'; }
  if (st.task) { t = T.solved ? 'Задача решена' : T.demo ? 'Показываю решение…' : 'Задача · доска и роутер ваши'; k = T.solved ? '' : 'edit'; }
  c.className = 'mode-chip' + (k ? ' ' + k : '');
  c.textContent = t;
}
function focusKey(el) {
  if (!el || !el.closest || !svg.contains(el)) return null;
  if (el.dataset.pkt) return '[data-pkt]';
  if (el.dataset.port) return '[data-port]';
  if (el.dataset.plug) return '[data-plug]';
  if (el.dataset.node) return `[data-node="${el.dataset.node}"]`;
  return null;
}
const _renderBoard = renderBoard;
renderBoard = function () {
  const fk = focusKey(document.activeElement);
  _renderBoard();
  if (fk) { const el = svg.querySelector(fk); if (el && el.getAttribute('tabindex') != null) el.focus({ preventScroll: true }); }
};
function sync() {
  renderBoard();
  renderTransport();
  if (S.tab === 'env') renderEnv();
  if (S.tab === 'browser') renderBrowser();
  if (S.step === TASK) renderCard();
  updateTabDots();
}
function renderAll() {
  renderTheory();
  renderCard();
  renderDock();
  renderBoard();
  renderTransport();
  renderModeChip();
}
function goTo(n) {
  if (n === S.step || !canGo(n)) return;
  enterStep(n);
  renderAll();
  if (STEPS[n].quiz || STEPS[n].task) setTimeout(showCard, 450);
}

// ---------- ответы на вопросы ----------
function showCard() {
  const c = $('card'), sc = $('theory-scroll');
  if (c && getComputedStyle(sc).overflowY === 'auto') setTimeout(() => c.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }), 60);
}
function answerFirstHop(id) {
  if (S.step !== 3 || S.quiz['first-hop']) return;
  const Q = QUIZ['first-hop'];
  if (!Q.cands.includes(id)) return;
  S.quiz['first-hop'] = { pick: id, first: id === Q.answer };
  PL.locked = false;
  stepFwd();
  renderCard(); renderModeChip(); renderTransport(); showCard();
}
function answerLayer(k) {
  if (S.step !== 5 || S.quiz['which-layer']) return;
  S.quiz['which-layer'] = { pick: k, first: k === QUIZ['which-layer'].answer };
  PL.locked = false;
  renderEnv(); renderCard(); renderModeChip(); renderTransport(); renderBoard(); showCard();
}
function openEnvelope() {
  PL.playing = false; PL.sel = true;
  setTab('env');
  sync();
  if (window.matchMedia('(max-width: 880px)').matches) $('dock').scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
}

// ---------- указатель на доске ----------
function svgPt(e) {
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(m.inverse());
}
const editTask = () => S.step === TASK && !T.solved && !T.demo;
function arm(from) {
  S.armed = from;
  toast(from === 'port' ? 'Теперь нажмите облако «Интернет».' : 'Теперь нажмите роутер.');
  renderBoard();
}
function tryConnect(target) {
  if (!target || !target.closest) return false;
  const g = S.gesture ? S.gesture.from : S.armed;
  if (g === 'port' && target.closest('[data-node="internet"], [data-plug]')) { connectWan(); return true; }
  if (g === 'plug' && target.closest('[data-node="router"], [data-port]')) { connectWan(); return true; }
  return false;
}
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const t = e.target;
  if (t.closest('[data-pkt]')) { e.preventDefault(); openEnvelope(); return; }
  const cand = t.closest('.cand');
  if (cand) { answerFirstHop(cand.dataset.node); return; }
  if (!editTask()) return;
  const port = t.closest('[data-port]'), plug = t.closest('[data-plug]');
  if (port || plug) {
    e.preventDefault();
    const from = port ? 'port' : 'plug';
    if (S.armed && S.armed !== from) { connectWan(); return; }
    S.gesture = { from, sx: e.clientX, sy: e.clientY, moved: false };
    return;
  }
  if (S.armed) { if (!tryConnect(t)) { S.armed = null; renderBoard(); } }
});
document.addEventListener('pointermove', e => {
  const g = S.gesture;
  if (!g) return;
  if (!g.moved && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) < 6) return;
  g.moved = true;
  const o = g.from === 'port' ? portPt() : looseEnd().e, p = svgPt(e);
  $('rubber').setAttribute('d', `M${P(o)} L${p.x.toFixed(1)},${p.y.toFixed(1)}`);
});
document.addEventListener('pointerup', e => {
  const g = S.gesture;
  if (!g) return;
  $('rubber').setAttribute('d', '');
  if (!g.moved) { S.gesture = null; arm(g.from); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!tryConnect(el)) toast(g.from === 'port' ? 'Кабель не дотянули: отпустите его над облаком «Интернет».' : 'Кабель не дотянули: отпустите его над роутером.');
  S.gesture = null;
});
document.addEventListener('pointercancel', () => { S.gesture = null; $('rubber').setAttribute('d', ''); });
svg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t.dataset.pkt) { e.preventDefault(); openEnvelope(); return; }
  if (t.classList.contains('cand')) { e.preventDefault(); answerFirstHop(t.dataset.node); return; }
  if (!editTask()) return;
  if (t.dataset.port || t.dataset.plug) { e.preventDefault(); const from = t.dataset.port ? 'port' : 'plug'; if (S.armed && S.armed !== from) connectWan(); else arm(from); return; }
  if (S.armed && t.dataset.node) { e.preventDefault(); tryConnect(t); }
});

// ---------- теория: ссылки, кнопки ----------
function hoverRef(e, on) {
  const r = e.target.closest && e.target.closest('.ref');
  if (!r) return;
  const id = r.dataset.ref;
  if (ENV_REF[id]) {
    S.envHl = on ? ENV_REF[id] : null;
    document.querySelectorAll('#pane-env [data-layer]').forEach(l => l.classList.toggle('hl', l.dataset.layer === S.envHl));
    const env = document.querySelector('#pane-env .env');
    if (env) env.classList.toggle('fade', !!S.envHl);
  } else if (DEV[id]) S.refHl = on ? id : null;
  else return;
  renderBoard();
}
$('beats').addEventListener('pointerover', e => hoverRef(e, true));
$('beats').addEventListener('pointerout', e => hoverRef(e, false));
$('beats').addEventListener('focusin', e => hoverRef(e, true));
$('beats').addEventListener('focusout', e => hoverRef(e, false));
$('beats').addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const k = a.dataset.action;
    if (k === 'next') goTo(S.step + 1);
    else if (k === 'hint') { T.hint = Math.min(3, T.hint + 1); if (T.hint >= 3) { T.rpTab = 'wifi'; S.tab = 'router'; renderDock(); } renderCard(); renderBoard(); }
    else if (k === 'solution') showSolution();
    else if (k === 'reset') { resetTask(); load([]); S.armed = null; renderDock(); renderBoard(); renderTransport(); renderCard(); renderModeChip(); }
    else if (k === 'copy') {
      const txt = $('ask-text').textContent;
      const done = () => { a.textContent = 'Скопировано'; };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($('ask-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); a.textContent = 'Выделено, нажмите ⌘C'; };
      try { navigator.clipboard.writeText(txt).then(done, fallback); } catch { fallback(); }
    }
    return;
  }
  const r = e.target.closest('.ref');
  if (r) {
    const id = r.dataset.ref;
    if (id === 'term') { setTab('term'); $('term-input').focus({ preventScroll: true }); if (window.matchMedia('(max-width: 880px)').matches) $('dock').scrollIntoView({ block: 'nearest' }); }
    else if (ENV_REF[id] && S.tab !== 'env') setTab('env');
    return;
  }
  const past = e.target.closest('.beat.past');
  if (past) goTo(+past.dataset.goto);
});
$('beats').addEventListener('keydown', e => {
  const r = e.target.closest && e.target.closest('.ref.act');
  if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); }
});
$('timeline').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b && !b.disabled) goTo(+b.dataset.goto); });
$('theory-nav').addEventListener('click', e => {
  if (e.target.closest('#nav-prev')) goTo(S.step - 1);
  if (e.target.closest('#nav-next')) goTo(S.step + 1);
});

// ---------- транспорт ----------
$('t-first').addEventListener('click', toFirst);
$('t-back').addEventListener('click', stepBack);
$('t-step').addEventListener('click', stepFwd);
$('t-play').addEventListener('click', togglePlay);
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { PL.speed = +b.dataset.speed; renderTransport(); }));

// ---------- поверхности ----------
$('dock-tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('dock-tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault(); e.stopPropagation();
  const t = tabsFor(), i = t.indexOf(S.tab);
  setTab(t[(i + (e.key === 'ArrowRight' ? 1 : t.length - 1)) % t.length], true);
});
$('pane-env').addEventListener('click', e => { const c = e.target.closest('[data-layer-pick]'); if (c && !c.disabled) answerLayer(c.dataset.layerPick); });
$('pane-env').addEventListener('pointerover', e => {
  const l = e.target.closest('[data-layer]'), k = l ? l.dataset.layer : null;
  if (k === S.envHl) return;
  S.envHl = k;
  document.querySelectorAll('#pane-env [data-layer]').forEach(x => x.classList.toggle('hl', x.dataset.layer === k));
  renderBoard();
});
$('pane-env').addEventListener('pointerleave', () => {
  if (!S.envHl) return;
  S.envHl = null;
  document.querySelectorAll('#pane-env [data-layer]').forEach(x => x.classList.remove('hl'));
  renderBoard();
});
$('pane-router').addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-rp]');
  if (tab) { T.rpTab = tab.dataset.rp; T.errors = {}; renderRouter(); $('rp-' + T.rpTab).focus(); return; }
  const band = t.closest('[data-band]');
  if (band && !band.disabled) { T.draft.band = band.dataset.band; T.saved = null; renderRouter(); return; }
  if (t.closest('#wf-save')) saveWifi();
  else if (t.closest('#wf-cancel')) { T.draft = { ...T.wifi }; T.errors = {}; renderRouter(); }
  else if (t.closest('#dh-save')) saveDhcp();
  else if (t.closest('#dh-cancel')) { T.dhcpDraft = { ...T.dhcp }; T.errors = {}; renderRouter(); }
});
$('pane-router').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'wf-ssid') T.draft.ssid = t.value;
  else if (t.id === 'wf-pass') T.draft.pass = t.value;
  else if (t.id === 'dh-from') T.dhcpDraft.from = t.value;
  else if (t.id === 'dh-to') T.dhcpDraft.to = t.value;
  else return;
  T.saved = null;
  const a = $('wf-dirty'), b = $('dh-dirty');
  if (a) a.hidden = !wifiDirty();
  if (b) b.hidden = !dhcpDirty();
  document.querySelectorAll('#pane-router .saved').forEach(x => x.remove());
});
$('pane-router').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'wf-sec') { T.draft.sec = t.value; T.saved = null; renderRouter(); }
  if (t.id === 'dh-on') { T.dhcpDraft.on = t.checked; T.saved = null; renderRouter(); }
});
$('pane-router').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.inp')) { e.preventDefault(); if (T.rpTab === 'wifi') saveWifi(); else saveDhcp(); }
});
$('pane-browser').addEventListener('click', e => { if (e.target.closest('[data-reload]')) reloadBrowser(); });
$('term-form').addEventListener('submit', e => { e.preventDefault(); const i = $('term-input'); runCmd(i.value); i.value = ''; });
$('term-quick').addEventListener('click', e => { const b = e.target.closest('[data-cmd]'); if (b) { runCmd(b.dataset.cmd); } });
$('term-input').addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  TERM.hi = clamp(TERM.hi + (e.key === 'ArrowUp' ? -1 : 1), 0, TERM.hist.length);
  e.target.value = TERM.hist[TERM.hi] || '';
});

// ---------- клавиатура и размер ----------
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select, [role="tablist"]')) return;
  if (e.key === 'Escape') { S.armed = null; S.gesture = null; $('rubber').setAttribute('d', ''); renderBoard(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') goTo(S.step + 1);
  if (e.key === 'ArrowLeft') goTo(S.step - 1);
});
const onLayout = () => { S.layout = narrowMQ.matches ? 'narrow' : 'wide'; renderBoard(); };
if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onLayout); else narrowMQ.addListener(onLayout);

// ---------- кадр ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 64);
  last = now;
  if (tick(dt)) sync();
  else if (PL.phase === 'fly') placePacket();
  if (S.flashPath && S.flashPath.until < now) { S.flashPath = null; renderBoard(); }
  requestAnimationFrame(frame);
}

tp('dim', '# Терминал ноутбука. Вывод упрощён и выглядит как в Unix; ping шлёт 3 пакета.');
tp('dim', '# Нажмите кнопку с командой ниже или наберите свою. help — список команд.');
enterStep(0);
renderAll();
termRender();
requestAnimationFrame(frame);
})();
</script>

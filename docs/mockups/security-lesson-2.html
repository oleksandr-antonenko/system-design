<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Безопасность: урок 5</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Nunito:wght@600;700;800&family=Unbounded:wght@500&display=swap">
<style>
/* Курс «Кибербезопасность для офиса», урок 5 «Письмо-приманка» (демо 2): учебник слева, справа кадры мультика; в вопросе и задаче — почтовый ящик */
:root {
  --bg: #EDF0EF;
  --page: #FAFBF9;
  --ink: #17202A;
  --muted: #5A6774;
  --line: #D2DAE0;
  --node: #FFFFFF;
  --node-line: #8D9BA8;
  --accent: #2B4BD4;
  --accent-soft: #E2E7FB;
  --ok: #148A55;
  --warn: #C27C05;
  --bad: #CF3F36;
  --bad-soft: #FBE6E4;
  --ok-soft: #E0F3E9;
  --screen: #FFFFFF;
  --word: #FFE9A8;
  --shadow: rgba(23, 32, 42, .18);
  --toon-bg: #F4EEE2;
  --toon-ink: #3A2A1F;
  --toon-paper: #FFFDF8;
  --toon-narr: #FFE7A3;
  --sign: #1F5FBF;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-prose: "Literata", "PT Serif", Georgia, serif;
  --f-ui: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-toon: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-phone: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --page: #131A21; --ink: #E3E9EF; --muted: #93A0AD;
    --line: #27323C; --node: #18202A; --node-line: #536475; --accent: #8EA3FF; --accent-soft: #1E2850;
    --ok: #3DC48B; --warn: #E8AA3C; --bad: #F2675C; --bad-soft: #3A1715; --ok-soft: #12301F;
    --screen: #10161D; --word: #4A3D12; --shadow: rgba(0, 0, 0, .55);
    --toon-bg: #1A1712;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --page: #131A21; --ink: #E3E9EF; --muted: #93A0AD;
  --line: #27323C; --node: #18202A; --node-line: #536475; --accent: #8EA3FF; --accent-soft: #1E2850;
  --ok: #3DC48B; --warn: #E8AA3C; --bad: #F2675C; --bad-soft: #3A1715; --ok-soft: #12301F;
  --screen: #10161D; --word: #4A3D12; --shadow: rgba(0, 0, 0, .55);
  --toon-bg: #1A1712;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- верхняя лента ---------- */
.top {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--page); border-bottom: 1px solid var(--line);
}
.crumb { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 10px; align-items: baseline; }
.crumb .brand { font-family: var(--f-display); font-weight: 500; font-size: 12.5px; color: var(--ink); }
.crumb b { color: var(--ink); font-weight: 600; }
.timeline { flex: 1 1 340px; display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 0; }
.tl-steps { display: flex; align-items: center; gap: 4px; }
.tl { appearance: none; border: 0; background: none; padding: 9px 0; cursor: pointer; display: grid; place-items: center; }
.tl .bar { display: block; width: 34px; height: 5px; border-radius: 3px; background: var(--line); transition: background .2s, height .2s; }
.tl.done .bar { background: var(--accent); opacity: .5; }
.tl.current .bar { background: var(--accent); height: 8px; }
.tl.is-task .bar { width: 11px; height: 11px; border-radius: 2px; transform: rotate(45deg); margin-inline: 5px; }
.tl.is-task.current .bar { height: 11px; }
.tl.is-task.solved .bar { background: var(--ok); opacity: 1; }
.tl.is-quiz .bar { width: 13px; height: 13px; border-radius: 50%; margin-inline: 4px; background: transparent; border: 2.5px solid var(--line); }
.tl.is-quiz.done .bar { border-color: var(--accent); background: transparent; }
.tl.is-quiz.current .bar { height: 13px; border-color: var(--accent); background: var(--accent-soft); opacity: 1; }
.tl.is-quiz.first .bar { border-color: var(--ok); background: var(--ok); opacity: 1; }
.tl.is-quiz.shown .bar { border-color: var(--warn); background: transparent; opacity: 1; }
.tl:disabled { cursor: not-allowed; }
.tl-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tl-label b { color: var(--ink); font-weight: 600; }
.top-note { font-size: 10.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

/* ---------- раскладка ---------- */
.main { display: grid; grid-template-columns: minmax(340px, 38%) minmax(0, 1fr); min-height: 0; }

.theory { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--page); border-right: 1px solid var(--line); }
.theory-scroll {
  position: relative; flex: 1; overflow-y: auto;
  padding-block: 26px 32px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: 28px;
}
.eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: 23px; line-height: 1.22; margin: 8px 0 6px; text-wrap: balance; letter-spacing: -.01em; }
.meta { font-size: 12px; color: var(--muted); }
.lesson-head { padding-bottom: 18px; display: grid; gap: 4px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.words .w { font-weight: 600; color: var(--ink); background: var(--word); border-radius: 999px; padding: 2px 10px; }

.beat { padding-block: 18px; border-top: 1px solid var(--line); }
.beat h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
.beat h2 .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.beat.past { opacity: .5; cursor: pointer; transition: opacity .15s; }
.beat.past:hover { opacity: .8; }
.beat.past .prose { font-size: 15px; }
.prose { font-family: var(--f-prose); font-size: 16.5px; line-height: 1.62; max-width: 62ch; }
.prose p { margin: 0; }
.prose p + p { margin-top: .75em; }
.prose strong, .prose b { font-weight: 600; }
.prose dfn { font-style: normal; font-weight: 600; background: linear-gradient(transparent 58%, var(--word) 58%); padding-inline: 1px; }
.prose ul { margin: .7em 0 0; padding-left: 1.2em; display: grid; gap: .35em; }
.prose li::marker { color: var(--accent); }
.prose code { font-family: var(--f-ui); font-size: .82em; background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
.ref { font-weight: 600; border-bottom: 1.5px dashed var(--accent); cursor: pointer; border-radius: 2px; }
.ref:hover, .ref:focus-visible, .ref.on { background: var(--accent-soft); }
.task-done { margin: 12px 0 0; font-size: 12px; color: var(--ok); font-weight: 600; }
.task-done.shown { color: var(--warn); }

/* подробнее */
.more { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--node); }
.more summary { cursor: pointer; list-style: none; padding: 11px 14px; font-size: 12.5px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: "+"; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 13px; line-height: 1; flex: none; }
.more[open] summary::before { content: "−"; }
.more summary .tag { margin-left: auto; font-weight: 500; font-size: 11px; color: var(--muted); white-space: nowrap; }
.more-body { padding: 0 16px 14px 42px; font-family: var(--f-prose); font-size: 15px; line-height: 1.58; display: grid; gap: .6em; }
.more-body p { margin: 0; }

/* итог урока */
.finish { margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.score { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; }
.next { border: 1.5px solid var(--accent); border-radius: 14px; background: var(--node); padding: 16px; display: grid; gap: 8px; }
.next h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 17px; line-height: 1.3; }
.next p { margin: 0; font-family: var(--f-prose); font-size: 15px; line-height: 1.55; }
.next .eyebrow { color: var(--accent); font-weight: 600; }

/* ---------- карточки задачи и вопроса ---------- */
.task { margin-top: 16px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--node); padding: 16px; display: grid; gap: 12px; }
.task.solved { border-color: var(--ok); }
.task.revealed { border-color: var(--warn); }
.task-head { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.task.solved .task-head { color: var(--ok); }
.task.revealed .task-head { color: var(--warn); }
.task-head .dia { width: 9px; height: 9px; background: currentColor; transform: rotate(45deg); border-radius: 1px; flex: none; }
.task-head .ring { width: 11px; height: 11px; border: 2.5px solid currentColor; border-radius: 50%; flex: none; }
.task-head .att { margin-left: auto; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: none; }
.task-goal { font-family: var(--f-prose); font-size: 16px; line-height: 1.5; font-weight: 600; margin: 0; }
.task-how { font-size: 12px; color: var(--muted); margin: 0; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; align-items: start; }
.checks .mk { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--node-line); display: grid; place-items: center; font-size: 10px; line-height: 1; margin-top: 1px; font-weight: 700; transition: background .25s, border-color .25s; }
.checks li.ok .mk { background: var(--ok); border-color: var(--ok); color: var(--page); }
.checks li.wait .mk { border-style: dashed; border-color: var(--accent); }
.checks li.no .mk { border-color: var(--bad); color: var(--bad); }
.checks .why { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.checks li.no .why { color: var(--bad); }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.fb.fail { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.fb.info { background: var(--accent-soft); border: 1px solid var(--accent); }
.fb p { margin: 0; }
.fb p + p { margin-top: 6px; }
.explain { font-family: var(--f-prose); font-size: 15px; line-height: 1.5; margin: 0; }
.mark { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; justify-self: start; }
.mark.first { color: var(--ok); background: var(--ok-soft); }
.mark.shown { color: var(--warn); border: 1px solid var(--warn); }
.hints { margin: 0; padding-left: 20px; font-size: 12.5px; display: grid; gap: 4px; }
.hints li::marker { color: var(--accent); }
.task-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* варианты ответа */
.opts { display: grid; gap: 8px; }
.opt { appearance: none; text-align: left; border: 1.5px solid var(--line); background: var(--page); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-family: var(--f-prose); font-size: 15px; line-height: 1.4; }
.opt .k { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font: 600 11px var(--f-ui); margin-top: 1px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--page); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--page); }
.opt.dim { opacity: .55; }

/* ---------- кнопки ---------- */
.btn { appearance: none; border: 1px solid var(--line); background: var(--node); color: var(--ink); border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--node-line); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--page); font-weight: 600; }
.btn.link { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 4px; }

.theory-nav {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: 28px;
  border-top: 1px solid var(--line); background: var(--page);
}
.theory-nav .nav-text { font-size: 11.5px; color: var(--muted); text-align: center; flex: 1; min-width: 0; }

/* ---------- сторона мультика ---------- */
.boardside {
  display: grid; min-width: 0; min-height: 0;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "stage" "transport";
}
.boardside.with-phone { grid-template-columns: minmax(0, 1fr) 336px; grid-template-areas: "stage phone" "transport phone"; }
.stage {
  grid-area: stage; position: relative; min-height: 240px; overflow: hidden;
  background: var(--toon-bg);
  container-type: size;
  display: grid; place-items: center;
}
.frame {
  position: relative;
  width: min(calc(100cqw - 40px), calc((100cqh - 40px) * 4 / 3));
  aspect-ratio: 4 / 3;
  border-radius: 18px; overflow: hidden;
  background: #F7F1E5;
  box-shadow: 0 1px 0 rgba(58, 42, 31, .08), 0 18px 40px -26px rgba(58, 42, 31, .55);
  container-type: inline-size;
}
.panel { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity .55s ease; pointer-events: none; }
.panel.on { opacity: 1; pointer-events: auto; }
.panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 8% 12%; text-align: center;
  background: repeating-linear-gradient(135deg, #F3EADA 0 14px, #EFE4D1 14px 28px);
  color: var(--toon-ink); font-family: var(--f-toon);
}
.ph .ph-ic { justify-self: center; width: 54px; height: 54px; border-radius: 14px; border: 2.5px dashed rgba(58, 42, 31, .45); display: grid; place-items: center; font-size: 24px; }
.ph .ph-t { font-weight: 800; font-size: clamp(11px, 2.4cqw, 15px); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.ph .ph-d { font-weight: 700; font-size: clamp(12px, 2.9cqw, 19px); line-height: 1.35; }
.ph .ph-n { font-size: clamp(10px, 2cqw, 12.5px); opacity: .65; font-weight: 600; }

/* слой реплик поверх кадра: координаты в процентах кадра */
.ov { position: absolute; inset: 0; pointer-events: none; }
.bub, .narr, .tag, .sign { position: absolute; pointer-events: none; font-family: var(--f-toon); color: var(--toon-ink); }
.bub {
  background: var(--toon-paper); border: 2.5px solid var(--toon-ink); border-radius: 18px;
  padding: .55em .8em .6em; font-size: clamp(11px, 2.35cqw, 17px); line-height: 1.3; font-weight: 700;
  box-shadow: 0 4px 0 rgba(58, 42, 31, .16);
  opacity: 0; transform: translateY(6px) scale(.92); transition: opacity .3s ease, transform .3s cubic-bezier(.3, 1.5, .5, 1);
}
.bub.shown { opacity: 1; transform: none; }
.bub .who { display: block; font-size: .72em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin-bottom: .1em; }
.bub::before, .bub::after { content: ""; position: absolute; border-style: solid; }
.bub.t-bl::before { left: 18%; bottom: -16px; border-width: 16px 14px 0 0; border-color: var(--toon-ink) transparent transparent; }
.bub.t-bl::after { left: calc(18% + 3px); bottom: -10px; border-width: 11px 9px 0 0; border-color: var(--toon-paper) transparent transparent; }
.bub.t-br::before { right: 18%; bottom: -16px; border-width: 16px 0 0 14px; border-color: var(--toon-ink) transparent transparent; }
.bub.t-br::after { right: calc(18% + 3px); bottom: -10px; border-width: 11px 0 0 9px; border-color: var(--toon-paper) transparent transparent; }
.bub.t-tl::before { left: 18%; top: -16px; border-width: 0 14px 16px 0; border-color: transparent transparent var(--toon-ink); }
.bub.t-tl::after { left: calc(18% + 3px); top: -10px; border-width: 0 9px 11px 0; border-color: transparent transparent var(--toon-paper); }
.bub.t-tr::before { right: 18%; top: -16px; border-width: 0 0 16px 14px; border-color: transparent transparent var(--toon-ink); }
.bub.t-tr::after { right: calc(18% + 3px); top: -10px; border-width: 0 0 11px 9px; border-color: transparent transparent var(--toon-paper); }
.bub.think { border-radius: 999px; border-style: dashed; font-weight: 600; font-style: italic; }
.bub.think::before, .bub.think::after { border: 2.5px solid var(--toon-ink); border-radius: 50%; background: var(--toon-paper); }
.bub.think.t-bl::before { left: 16%; bottom: -14px; width: 12px; height: 12px; border-width: 2.5px; border-color: var(--toon-ink); }
.bub.think.t-bl::after { left: 10%; bottom: -26px; width: 8px; height: 8px; border-width: 2px; border-color: var(--toon-ink); }
.bub.think.t-br::before { right: 16%; bottom: -14px; width: 12px; height: 12px; border-width: 2.5px; border-color: var(--toon-ink); }
.bub.think.t-br::after { right: 10%; bottom: -26px; width: 8px; height: 8px; border-width: 2px; border-color: var(--toon-ink); }
.bub.think.t-tr::before { right: 16%; top: -14px; width: 12px; height: 12px; border-width: 2.5px; border-color: var(--toon-ink); }
.bub.think.t-tr::after { right: 10%; top: -26px; width: 8px; height: 8px; border-width: 2px; border-color: var(--toon-ink); }
.bub.think.t-tl::before { left: 16%; top: -14px; width: 12px; height: 12px; border-width: 2.5px; border-color: var(--toon-ink); }
.bub.think.t-tl::after { left: 10%; top: -26px; width: 8px; height: 8px; border-width: 2px; border-color: var(--toon-ink); }
.bub.bad { border-color: var(--bad); }
.bub.bad.t-br::before, .bub.bad.t-bl::before { border-top-color: var(--bad); }
.narr {
  left: 2.5%; top: 3%; max-width: 62%;
  background: var(--toon-narr); border: 2.5px solid var(--toon-ink); border-radius: 6px;
  padding: .35em .7em; font-size: clamp(10.5px, 2.1cqw, 15px); font-weight: 800; letter-spacing: .02em;
  box-shadow: 3px 3px 0 rgba(58, 42, 31, .85);
  transform: rotate(-1.2deg);
}
.tag {
  display: inline-flex; align-items: center; gap: .4em; white-space: nowrap;
  background: var(--toon-paper); border: 2px solid var(--toon-ink); border-radius: 999px;
  padding: .15em .65em .2em .45em; font-size: clamp(9.5px, 1.75cqw, 13px); font-weight: 800;
  transform: translate(-50%, -50%);
  opacity: 0; transition: opacity .3s;
}
.tag::before { content: ""; width: .6em; height: .6em; border-radius: 50%; background: var(--tag, #2FA37A); border: 1.5px solid var(--toon-ink); }
.tag.shown { opacity: 1; }
.tag.hl { outline: 3px solid var(--accent); outline-offset: 2px; }
.hlbox { position: absolute; border: 3px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, transparent); opacity: 0; transition: opacity .2s; pointer-events: none; }
.hlbox.on { opacity: 1; }

/* табличка с сетью в аэропорту */
.sign {
  pointer-events: auto; cursor: pointer; appearance: none; text-align: left;
  background: var(--sign); color: #fff; border: 2.5px solid var(--toon-ink); border-radius: 8px;
  padding: .45em .7em .5em; font-size: clamp(9.5px, 1.8cqw, 14px); line-height: 1.25; font-weight: 700;
  box-shadow: 0 4px 0 rgba(58, 42, 31, .25);
}
.sign b { display: block; font-size: 1.25em; font-family: var(--f-ui); letter-spacing: .02em; }
.sign small { display: block; opacity: .85; font-size: .82em; }
.sign:hover, .sign:focus-visible, .sign.on { outline: 3px solid var(--warn); outline-offset: 2px; }
.sign-pop {
  position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-.8deg);
  width: min(320px, calc(100% - 24px));
  background: var(--sign); color: #fff; border: 3px solid var(--toon-ink); border-radius: 12px;
  padding: 16px 18px; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .5); display: grid; gap: 8px; font-family: var(--f-toon);
}
.sign-pop .sp-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.sign-pop .sp-x { margin-left: auto; appearance: none; border: 0; background: none; color: inherit; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.sign-pop .ssid { font-family: var(--f-ui); font-size: 22px; font-weight: 700; letter-spacing: .03em; }
.sign-pop p { margin: 0; font-size: 13.5px; line-height: 1.4; }

/* итог: миниатюры кадров */
.thumbs { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3%; padding: 3%; background: var(--toon-bg); }
.thumb { position: relative; margin: 0; border-radius: 12px; overflow: hidden; background: #F7F1E5; border: 2.5px solid var(--toon-ink); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb figcaption { position: absolute; left: 6px; right: 6px; bottom: 6px; background: var(--toon-paper); border: 2px solid var(--toon-ink); border-radius: 8px; padding: .3em .55em; font: 800 clamp(9px, 1.7cqw, 13px)/1.25 var(--f-toon); color: var(--toon-ink); }
.thumb .ph { padding: 6%; }
.thumb .ph .ph-ic { width: 34px; height: 34px; font-size: 16px; }
.thumb .ph .ph-d { font-size: clamp(10px, 1.8cqw, 13px); }

.mode-chip { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--page); border: 1px solid var(--line); color: var(--muted); pointer-events: none; z-index: 3; }
.mode-chip.quiz, .mode-chip.edit { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.stage.flash .frame { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--ok); } 100% { box-shadow: 0 0 0 0 var(--ok); } }

/* ---------- под кадром ---------- */
.transport {
  grid-area: transport; background: var(--page); border-top: 1px solid var(--line);
  padding-block: 10px;
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px; min-width: 0;
}
/* прогресс под кадром: точки шагов и «2 / 10»; листают только «Назад» и «Далее» */
.pnav { display: flex; align-items: center; gap: 10px; flex: none; }
.pdots { display: flex; gap: 5px; align-items: center; }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pdot.past { background: var(--accent); opacity: .45; }
.pdot.on { background: var(--accent); width: 18px; border-radius: 4px; }
.pdot.is-task { border-radius: 2px; transform: rotate(45deg); width: 7px; height: 7px; }
.pdot.is-task.on { width: 9px; height: 9px; border-radius: 2px; }
.pdot.is-quiz { background: transparent; border: 2px solid var(--line); }
.pdot.is-quiz.past { border-color: var(--accent); }
.pdot.is-quiz.on { border-color: var(--accent); background: var(--accent-soft); width: 10px; height: 10px; border-radius: 50%; }
.pcount { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.theory-nav .nav-text { display: grid; gap: 1px; justify-items: center; }
.theory-nav .progress { font-size: 13px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.theory-nav .nav-hint { font-size: 11px; color: var(--muted); }
.caption { margin: 0; display: flex; gap: 9px; align-items: baseline; min-width: 0; font-family: var(--f-prose); font-size: 14.5px; line-height: 1.4; }
.caption .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(1px); background: var(--node-line); }
.caption.info .dot { background: var(--accent); }
.caption.ok .dot { background: var(--ok); }
.caption.bad .dot { background: var(--bad); }
.caption.bad { color: var(--bad); }

/* карточка-лупа поверх кадра: адрес отправителя крупно */
.bub.zoom { font-family: var(--f-phone); font-weight: 500; border-radius: 12px; padding: .6em .8em; }
.zoom .z-from { display: block; font-size: .78em; color: #6B5A4C; }
.zoom .z-addr { display: block; font-family: var(--f-ui); font-weight: 700; font-size: 1.05em; letter-spacing: .01em; }
.zoom .z-addr mark { background: #FFD6CF; color: #B3261E; border-radius: 3px; padding: 0 1px; }
.zoom .z-note { display: block; margin-top: .25em; font-family: var(--f-toon); font-weight: 800; font-size: .8em; color: #B3261E; }

/* ---------- проверка: окно «Выиграй iPhone Duo» (страница-двойник, светлая в любой теме, как настоящий сайт) ---------- */
.trap { display: grid; grid-template-rows: auto minmax(0, 1fr); background: #FFFFFF; color: #202124; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px -28px var(--shadow); font-family: var(--f-phone); min-height: 0; position: relative; }
.trap-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #F1F3F4; border-bottom: 1px solid #DADCE0; font-size: 12px; }
.trap-bar .wd { display: flex; gap: 5px; }
.trap-bar .wd i { width: 10px; height: 10px; border-radius: 50%; background: #C9CDD2; display: block; }
.trap-url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 999px; padding: 4px 12px; color: #3C4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trap-url .lock { font-size: 10px; }
.trap-url.reveal { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.trap-url.reveal b { color: #C5221F; }
.trap-body { overflow-y: auto; min-height: 0; padding: 18px 16px 22px; display: grid; justify-items: center; align-content: start; gap: 14px; background: linear-gradient(180deg, #FFF4D6 0, #FFFFFF 180px); }
.trap-prize { text-align: center; display: grid; gap: 4px; }
.trap-prize .conf { font-size: 22px; letter-spacing: 6px; }
.trap-prize h3 { margin: 0; font-family: var(--f-display); font-size: clamp(22px, 4.4cqw, 30px); line-height: 1.1; color: #202124; }
.trap-prize p { margin: 0; font-size: 13px; color: #5F6368; }
.trap-prize .timer { display: inline-block; margin-top: 4px; font-weight: 700; color: #C5221F; font-variant-numeric: tabular-nums; }
.trap-card { width: min(100%, 360px); background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 10px; padding: 20px 22px 18px; display: grid; gap: 12px; box-shadow: 0 1px 3px rgba(60, 64, 67, .18); }
.trap-logo { font-family: "Product Sans", var(--f-phone); font-size: 24px; font-weight: 500; letter-spacing: -.3px; text-align: center; }
.trap-logo span:nth-child(1), .trap-logo span:nth-child(4) { color: #4285F4; }
.trap-logo span:nth-child(2), .trap-logo span:nth-child(7) { color: #EA4335; }
.trap-logo span:nth-child(3) { color: #FBBC05; }
.trap-logo span:nth-child(5) { color: #34A853; }
.trap-logo span:nth-child(6) { color: #EA4335; }
.trap-card h4 { margin: 0; text-align: center; font-size: 18px; font-weight: 400; color: #202124; }
.trap-card .sub { margin: -6px 0 2px; text-align: center; font-size: 13px; color: #5F6368; }
.trap-field { display: grid; gap: 4px; }
.trap-field label { font-size: 12px; color: #5F6368; }
.trap-field input { font: inherit; font-size: 14px; color: #202124; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 6px; padding: 10px 12px; }
.trap-field input:focus { outline: none; border-color: #1A73E8; box-shadow: 0 0 0 1px #1A73E8; }
.trap-field input.masked { -webkit-text-security: disc; text-security: disc; }
.trap-field .err { min-height: 1em; font-size: 12px; color: #C5221F; }
.trap-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.trap-row button { font: inherit; font-size: 13.5px; border-radius: 999px; padding: 8px 20px; cursor: pointer; }
.trap-skip { background: transparent; border: none; color: #1A73E8; font-weight: 500; padding-inline: 8px !important; }
.trap-skip:hover { background: #F1F6FE; }
.trap-login { background: #1A73E8; border: 1px solid #1A73E8; color: #FFFFFF; font-weight: 500; }
.trap-login:hover { background: #185ABC; }
.trap-fine { font-size: 11px; color: #80868B; text-align: center; max-width: 360px; }
.trap.decided .trap-body { filter: grayscale(.85); opacity: .45; pointer-events: none; }
.trap-stamp { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%) rotate(-6deg); padding: 10px 18px; border: 3px solid currentColor; border-radius: 10px; background: rgba(255, 255, 255, .92); font-family: var(--f-display); font-size: clamp(16px, 3.4cqw, 24px); font-weight: 700; text-align: center; line-height: 1.2; letter-spacing: .02em; }
.trap-stamp small { display: block; font-family: var(--f-ui); font-size: 12px; font-weight: 600; letter-spacing: 0; }
.trap-stamp.ok { color: #148A55; }
.trap-stamp.bad { color: #C5221F; }

/* ---------- почта ---------- */
.mailwrap { position: absolute; inset: 14px; display: grid; }
.mail { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--node); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px -28px var(--shadow); font-family: var(--f-phone); min-height: 0; }
.mail-bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--page); font-size: 12.5px; }
.mail-bar .wd { display: flex; gap: 5px; }
.mail-bar .wd i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.mail-bar .app-t { font-weight: 700; }
.mail-bar .acc { margin-left: auto; color: var(--muted); font-family: var(--f-ui); font-size: 11.5px; }
.mail-main { display: grid; grid-template-columns: minmax(210px, 37%) minmax(0, 1fr); min-height: 0; }
.mail-main.single { grid-template-columns: minmax(0, 1fr); }
.inbox { overflow-y: auto; border-right: 1px solid var(--line); min-height: 0; }
.inbox-h { padding: 10px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.msg { appearance: none; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 10px 12px 10px 14px; position: relative; }
.msg:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.msg.sel { background: var(--accent-soft); }
.msg.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.msg .from { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.unread .from::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.msg .time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msg .subj { grid-column: 1 / -1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .prev { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .lbl { grid-column: 1 / -1; justify-self: start; margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; border-radius: 999px; padding: 1px 8px; }
.lbl.phish { color: var(--bad); background: var(--bad-soft); border: 1px solid var(--bad); }
.lbl.okm { color: var(--ok); background: var(--ok-soft); border: 1px solid var(--ok); }
.lbl.wrongm { color: var(--warn); border: 1px dashed var(--warn); }
.msg.ghost { outline-offset: -4px; }

.reader { overflow-y: auto; padding: 16px 20px 18px; display: grid; align-content: start; gap: 12px; position: relative; min-height: 0; }
.r-subj { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; letter-spacing: -.005em; }
.r-from { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.r-who { display: grid; gap: 1px; min-width: 0; }
.namebtn { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); display: inline-flex; gap: 5px; align-items: center; justify-self: start; border-bottom: 1.5px dashed var(--node-line); }
.namebtn:hover { border-bottom-color: var(--accent); color: var(--accent); }
.namebtn .car { font-size: 10px; color: var(--muted); }
.addr { font-family: var(--f-ui); font-size: 12px; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; justify-self: start; overflow-wrap: anywhere; }
.r-to { font-size: 11.5px; color: var(--muted); }
.r-time { font-size: 12px; color: var(--muted); align-self: start; }
.r-body { font-size: 14.5px; line-height: 1.55; display: grid; gap: .6em; }
.r-body p { margin: 0; }
.r-link { appearance: none; justify-self: start; border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; background: #2D6CDF; color: #fff; }
.r-link.text { background: none; color: #2D6CDF; padding: 0; text-decoration: underline; font-weight: 600; }
.r-att { appearance: none; justify-self: start; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--page); cursor: pointer; font-size: 13px; }
.r-att .pdf { width: 26px; height: 30px; border-radius: 4px; background: #D9483B; color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 800; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mbtn { appearance: none; border: 1.5px solid var(--line); background: var(--node); border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.mbtn.phish { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.mbtn.phish:hover:not(:disabled) { background: var(--bad-soft); border-color: var(--bad); }
.mbtn.okb { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.mbtn.okb:hover:not(:disabled) { background: var(--ok-soft); border-color: var(--ok); }
.mbtn:disabled { opacity: .45; cursor: not-allowed; }
.r-fb { border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
.r-fb.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.r-fb.fail { background: var(--bad-soft); border: 1px solid var(--bad); }
.r-fb b { display: block; margin-bottom: 2px; }
.r-empty { color: var(--muted); font-size: 14px; display: grid; place-items: center; text-align: center; padding: 40px 20px; gap: 8px; }
.statusbar { font-family: var(--f-ui); font-size: 11.5px; padding: 5px 12px; border-top: 1px solid var(--line); color: var(--muted); min-height: 27px; background: var(--page); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar b { color: var(--ink); font-weight: 600; }

/* страница по ссылке */
.webpage { position: absolute; inset: 0; background: var(--node); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 2; }
.wp-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--page); }
.wp-url { flex: 1; font-family: var(--f-ui); font-size: 12px; background: var(--node); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-body { overflow-y: auto; padding: 22px 22px; display: grid; gap: 12px; align-content: start; justify-items: start; }
.wp-body h4 { margin: 0; font-size: 18px; }
.wp-body p { margin: 0; font-size: 14px; line-height: 1.5; }
.wp-form { display: grid; gap: 8px; width: min(100%, 300px); padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
.wp-form .in { height: 34px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--page); }
.wp-form .go { height: 36px; border-radius: 8px; background: #2D6CDF; }
.cardboard { border: 2px dashed #B98A4E; background: repeating-linear-gradient(90deg, #F3E3C6 0 10px, #EFDDBB 10px 20px); border-radius: 12px; padding: 14px 16px; color: #4A3418; font-size: 13.5px; line-height: 1.45; max-width: 460px; font-family: var(--f-toon); font-weight: 700; }

/* вопрос: письмо с горячими точками */
.mail-main.single .reader { max-width: 760px; }
.hot { justify-self: start; appearance: none; border: 2px dashed transparent; background: none; border-radius: 8px; padding: 2px 6px; margin: -2px -8px; cursor: pointer; text-align: left; font: inherit; color: inherit; position: relative; transition: border-color .15s, background .15s; }
.quizmode .hot { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.quizmode .hot:hover, .quizmode .hot:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.hot.right { border: 2.5px solid var(--ok); background: var(--ok-soft); }
.hot.wrong { border: 2.5px solid var(--bad); background: var(--bad-soft); }
.hot:disabled { cursor: default; }
.hot-note { display: block; font: 700 11px/1.35 var(--f-ui); margin-top: 4px; }
.hot.right .hot-note { color: var(--ok); }
.hot.wrong .hot-note { color: var(--bad); }
.logo { width: 38px; height: 38px; border-radius: 50%; background: #FFF4C9; border: 1.5px solid #E5C24A; display: grid; place-items: center; font-size: 20px; }
.r-sign { font-size: 13px; color: var(--muted); line-height: 1.45; }

/* ---------- узкий экран ---------- */
@media (max-width: 880px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .main { display: flex; flex-direction: column; }
  .boardside { order: -1; }
  .boardside { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "stage" "transport"; }
  .theory { border-right: 0; border-top: 1px solid var(--line); }
  .theory-scroll { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  /* на телефоне текст стоит сразу под кадром: прошлые шаги не показываем, к ним ведёт «Назад» */
  .beat.past { display: none; }
  .theory-nav { position: sticky; bottom: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 4; }
  .stage { min-height: 0; height: auto; container-type: inline-size; padding: 12px; display: block; }
  .frame { width: 100%; }
  .mailwrap { position: relative; inset: auto; }
  .mail-main { grid-template-columns: minmax(0, 1fr); }
  .inbox { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
  .reader { min-height: 360px; }
  .transport { padding-left: max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; gap: 8px 12px; }
  .caption { flex-basis: 100%; }
  .top-note { display: none; }
  .mode-chip { top: 16px; right: 16px; }
}
@media (max-width: 600px) {
  .tl .bar { width: 22px; }
  .tl-steps { gap: 3px; }
  .timeline { flex-wrap: wrap; gap: 4px 12px; }
  .caption { font-size: 14px; }
  .theory-nav .nav-hint { display: none; }
  .mode-chip { display: none; }
  .more-body { padding-left: 16px; }
  .bub { border-width: 2px; padding: .4em .6em .45em; }
  .reader { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .bub, .tag { transition: none; }
  .stage.flash .frame { animation: none; }
  .tl .bar, .checks .mk { transition: none; }
}
</style>
</head>
<body>

function imgTag(p) {
  return `<img src="${ART}${p.img}.webp" alt="${esc(p.alt)}" data-ph="${esc(p.alt)}" decoding="async">`;
}
function phHtml(alt, small) {
  return `<div class="ph" role="img" aria-label="${esc(alt)}"><div class="ph-ic" aria-hidden="true">✎</div>${small ? '' : '<div class="ph-t">Кадр мультика</div>'}<div class="ph-d">${esc(alt)}</div>${small ? '' : '<div class="ph-n">заглушка: картинка ещё не сгенерирована</div>'}</div>`;
}
function guardImages(root) {
  root.querySelectorAll('img[data-ph]').forEach(img => {
    const swap = () => { const small = !!img.closest('.thumb'); img.insertAdjacentHTML('afterend', phHtml(img.dataset.ph, small)); img.remove(); };
    if (img.complete && img.naturalWidth === 0) swap();
    else img.addEventListener('error', swap, { once: true });
  });
}

      S.trap ? (S.trap.pick === 'skip' ? '<span class="mark first">✓ Проверка: не попались</span>' : '<span class="mark shown">● Проверка: попались</span>') : '',
      S.quiz ? (S.quiz.first ? '<span class="mark first">✓ Вопрос: с первой попытки</span>' : '<span class="mark shown">● Вопрос: ответ показан</span>') : '',
      M.solved ? `<span class="mark ${M.help || M.clicked.length ? 'shown' : 'first'}">${M.help ? '● Задача: с показом решения' : M.clicked.length ? '● Задача: решена, но ссылка в приманке нажата' : '✓ Задача решена'}</span>` : '',
    ].join('');
    parts.push(`<div class="finish">
      <div class="eyebrow">Урок 5 пройден</div>
      <div class="score">${score}</div>
      <div class="next">
        <div class="eyebrow">Дальше · урок 6</div>
        <h3>Звонок «из IT»</h3>
        <p>Полосатый больше не пишет — он звонит. Голосом «Иры из IT» просит поставить программу «для проверки», а потом пишет в мессенджер с нового номера «Виктора». Разберём, почему людей обмануть проще, чем компьютеры, и как отказать вежливо.</p>
        <div><a class="btn" href="security-lesson-1.html">← Демо-урок 1: «Wi-Fi — общая комната»</a></div>
      </div>
    </div>`);
  }
  $('beats').innerHTML = parts.join('');
  if (openMore && $('more')) $('more').open = true;
  const sc = $('theory-scroll'), cur = $('beat-' + S.step);
  if (cur && getComputedStyle(sc).overflowY === 'auto') sc.scrollTo({ top: Math.max(0, cur.offsetTop - 16), behavior: reduce ? 'auto' : 'smooth' });
}
function quizCard() {
  const q = S.quiz;
  let body;
  if (!q) body = `<p class="task-how">На письме ${mobileMQ.matches ? 'выше' : 'справа'} пунктиром обведены пять мест: имя, адрес, тема, кнопка и подпись. Нажмите одно. Попытка одна, после неё покажем ответ и объяснение.</p>`;
  else {
    body = q.first ? '<div class="fb ok"><p>Верно: адрес отправителя.</p></div>'
      : `<div class="fb fail"><p>${esc(QUIZ.notes[q.pick])}</p><p>Правильный ответ: <strong>адрес отправителя</strong>.</p></div>`;
    body += `<p class="explain">${esc(QUIZ.explain)}</p>
      <span class="mark ${q.first ? 'first' : 'shown'}">${q.first ? '✓ Верно с первой попытки' : '● Ответ показан · в прогресс без отметки'}</span>
      <div class="task-actions"><button class="btn primary" type="button" data-action="next" id="card-next">Далее →</button></div>`;
  }
  const st = q ? (q.first ? ' solved' : ' revealed') : '';
  return `<div class="task${st}"><div class="task-head"><span class="ring" aria-hidden="true"></span>Вопрос на письме<span class="att">одна попытка</span></div>
    <p class="task-goal">Что в этом письме выдаёт подделку наверняка?</p>${body}</div>`;
}
function taskCard() {
  const { ph, re } = counts();
  const wrong = Object.entries(M.marks).filter(([id, k]) => (k === 'phish') !== EMAILS.find(m => m.id === id).phish).length;
  const goals = [
    { st: ph === PHISH_N ? 'ok' : ph ? 'wait' : '', label: `Найдены все приманки · ${ph} из ${PHISH_N}`, why: ph === PHISH_N ? 'Все три помечены «Это фишинг».' : '' },
    { st: re === REAL_N ? 'ok' : re ? 'wait' : '', label: `Настоящие письма не тронуты · ${re} из ${REAL_N}`, why: wrong ? `Отмечено неверно: ${wrong}. Откройте письмо и поправьте пометку.` : re === REAL_N ? 'Три настоящих письма отмечены «Настоящее».' : '' },
    { st: M.clicked.length ? 'no' : M.solved ? 'ok' : '', label: 'В приманках ничего не нажато', why: M.clicked.length ? `Нажата ссылка или вложение в приманке: ${M.clicked.length}. В жизни — сразу сообщить в IT.` : 'Проверяйте адрес наведением, без клика.' },
  ];
  const items = goals.map(g => `<li class="${g.st}"><span class="mk" aria-hidden="true">${g.st === 'ok' ? '✓' : g.st === 'no' ? '✕' : ''}</span><span>${g.label}${g.why ? `<span class="why">${esc(g.why)}</span>` : ''}</span></li>`).join('');
  let body;
  if (M.solved) {
    body = `<div class="fb ok">Готово: три приманки пойманы, настоящие письма на месте.${M.clicked.length ? ' Одна ошибка всё же была: ссылку в приманке нажимать не стоило.' : ''} В жизни каждую приманку ещё пересылают в IT — письмо пришло не только вам.</div>
      <div class="task-actions"><button class="btn primary" type="button" data-action="next" id="card-next">Далее: итог →</button></div>`;
  } else {
    const hints = M.hint ? `<ol class="hints">${HINTS.slice(0, M.hint).map(t => `<li>${t}</li>`).join('')}</ol>` : '';
    const showSol = M.fails >= 2 || M.hint >= 2;
    body = `${hints}<div class="task-actions">
      <button class="btn" type="button" data-action="hint" id="task-hint" ${M.hint >= 3 || M.demo ? 'disabled' : ''}>Подсказка · ${M.hint} из 3</button>
      ${showSol ? `<button class="btn link" type="button" data-action="solution" id="task-solution" ${M.demo ? 'disabled' : ''}>Показать решение</button>` : ''}</div>`;
  }
  return `<div class="task${M.solved ? ' solved' : ''}">
    <div class="task-head"><span class="dia" aria-hidden="true"></span>${M.solved ? `Решено${M.help ? ' с показом решения' : ''}` : 'Задача в почте'}</div>
    <p class="task-goal">Разберите шесть писем: найдите три приманки.</p>
    ${M.solved ? '' : `<p class="task-how">Почта ${mobileMQ.matches ? 'выше' : 'справа'}. Имя отправителя нажимается, ссылки показывают адрес при наведении. Цели проверяются сами.</p>`}
    <ul class="checks">${items}</ul>${body}</div>`;
}
function renderCard() {
  const el = $('card');
  if (el) {
    const fid = document.activeElement && document.activeElement.id;
    el.innerHTML = S.step === TRAP ? trapCard() : S.step === QUIZ_STEP ? quizCard() : S.step === TASK ? taskCard() : '';
    if (fid) { const f = document.getElementById(fid); if (f && !f.disabled && el.contains(f)) f.focus({ preventScroll: true }); }
  }
  renderNav();
  renderTimeline();
}
function renderNav() {
  const fid = document.activeElement && document.activeElement.id;
  const done = stepDone(S.step), last = S.step === LAST;
  const text = !done ? (S.step === TRAP ? 'Решите, что делать с окном, чтобы продолжить' : S.step === QUIZ_STEP ? 'Ответьте на вопрос, чтобы продолжить' : 'Разберите почту, чтобы продолжить') : last ? 'Конец урока' : 'Прочитали? Нажмите «Далее» · стрелки ← → тоже работают';
  $('theory-nav').innerHTML = `<button class="btn" type="button" id="nav-prev" ${S.step === 0 ? 'disabled' : ''}>← Назад</button>
    <span class="nav-text"><span class="progress" aria-label="Шаг ${S.step + 1} из ${STEPS.length}">${S.step + 1} / ${STEPS.length}</span><span class="nav-hint">${text}</span></span>
    <button class="btn primary" type="button" id="nav-next" ${!done || last ? 'disabled' : ''}>Далее →</button>`;
  if (fid === 'nav-prev' || fid === 'nav-next') { const f = $(fid); if (f && !f.disabled) f.focus({ preventScroll: true }); }
}
function renderModeChip() {
  const c = $('mode-chip'), st = STEPS[S.step];
  let t = '', k = '';
  if (st.quiz) { t = S.quiz ? 'Вопрос · ответ показан' : 'Вопрос · нажмите место на письме'; k = S.quiz ? '' : 'quiz'; }
  if (st.task) { t = M.solved ? 'Задача решена' : 'Задача · почта Марины'; k = M.solved ? '' : 'edit'; }
  if (st.summary) t = 'Кадры урока';
  c.className = 'mode-chip' + (k ? ' ' + k : '');
  c.textContent = t;
  c.hidden = !t || !!(st.quiz || st.task || st.trap);
}
function caption() {
  const st = STEPS[S.step];
  if (st.summary) return ['', 'Четыре кадра, которые стоит запомнить.'];
  if (st.trap) return !S.trap ? ['info', 'Решите сами, что сделать с окном.'] : S.trap.pick === 'skip' ? ['ok', 'Вы пропустили приманку.'] : ['bad', 'Вы попались. Пароль мы не сохраняли, поля стёрты.'];
  if (st.quiz) return S.quiz ? [S.quiz.first ? 'ok' : 'bad', S.quiz.first ? 'Верно: подделку выдаёт домен в адресе.' : 'Подделку выдаёт домен в адресе отправителя.'] : ['info', 'Нажмите на письме место, которое выдаёт подделку.'];
  if (st.task) {
    const { ph, re } = counts();
    if (M.solved) return ['ok', 'Почта разобрана: три приманки помечены.'];
    return ['', `Приманок найдено: ${ph} из ${PHISH_N} · настоящих отмечено: ${re} из ${REAL_N}.`];
  }
  return ['', st.panel ? st.panel.narr : ''];
}
function renderTransport() {
  $('pdots').innerHTML = STEPS.map((b, i) => `<span class="pdot${i === S.step ? ' on' : i < S.step ? ' past' : ''}${b.task ? ' is-task' : b.quiz || b.trap ? ' is-quiz' : ''}"></span>`).join('');
  $('pcount').textContent = `${S.step + 1} / ${STEPS.length}`;
  const [tone, text] = caption(), c = $('caption');
  c.className = 'caption' + (tone ? ' ' + tone : '');
  c.innerHTML = `<span class="dot" aria-hidden="true"></span><span>${esc(text)}</span>`;
  renderModeChip();
}

// ---------- переходы ----------
function goTo(n) {
  if (n === S.step || !canGo(n)) return;
  S.step = n; S.maxStep = Math.max(S.maxStep, n); S.refHl = null;
  M.status = '';
  renderTheory(); renderCard(); renderStage(); renderTransport();
  // На телефоне кадр над текстом: после «Далее» показываем новый кадр, текст — сразу под ним.
  if (mobileMQ.matches) window.scrollTo({ top: 0, behavior: 'auto' });
  else if (n === TRAP || n === QUIZ_STEP || n === TASK) showCard();
}
function showCard() {
  const c = $('card'), sc = $('theory-scroll');
  if (c && getComputedStyle(sc).overflowY === 'auto') c.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
}
function answerQuiz(id) {
  if (S.step !== QUIZ_STEP || S.quiz) return;
  S.quiz = { pick: id, first: id === QUIZ.answer };
  renderMail(); renderCard(); renderTransport(); showCard();
}

// ---------- события ----------
$('mailwrap').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('.trap-field input')) { e.preventDefault(); answerTrap('login'); }
});
$('mailwrap').addEventListener('input', e => {
  const f = e.target.closest('.trap-field');
  if (f) { const err = f.querySelector('.err'); if (err) err.textContent = ''; }
});
$('mailwrap').addEventListener('click', e => {
  const tr = e.target.closest('[data-trap]');
  if (tr && !tr.disabled) { answerTrap(tr.dataset.trap); return; }
  const h = e.target.closest('[data-hot]');
  if (h && !h.disabled) { answerQuiz(h.dataset.hot); return; }
  if (M.demo) return;
  const ml = e.target.closest('[data-mail]');
  if (ml) { openMail(ml.dataset.mail); return; }
  const nm = e.target.closest('[data-name]');
  if (nm) { M.shown[nm.dataset.name] = !M.shown[nm.dataset.name]; renderMail(); return; }
  const mk = e.target.closest('[data-mark]');
  if (mk && !mk.disabled) { markMail(mk.dataset.mark); return; }
  const lk = e.target.closest('[data-link]');
  if (lk) { clickLink(lk.dataset.link, lk.dataset.url); return; }
  const pg = e.target.closest('[data-page]');
  if (pg) { M.page = null; renderMail(); }
});
const linkHover = (e, on) => { const lk = e.target.closest && e.target.closest('[data-url]'); if (lk) setStatus(on ? lk.dataset.url : ''); };
$('mailwrap').addEventListener('pointerover', e => linkHover(e, true));
$('mailwrap').addEventListener('pointerout', e => linkHover(e, false));
$('mailwrap').addEventListener('focusin', e => linkHover(e, true));
$('mailwrap').addEventListener('focusout', e => linkHover(e, false));

function hoverRef(e, on) {
  const r = e.target.closest && e.target.closest('.ref');
  if (!r) return;
  S.refHl = on ? r.dataset.ref : null;
  applyFrame();
}
$('beats').addEventListener('pointerover', e => hoverRef(e, true));
$('beats').addEventListener('pointerout', e => hoverRef(e, false));
$('beats').addEventListener('focusin', e => hoverRef(e, true));
$('beats').addEventListener('focusout', e => hoverRef(e, false));
$('beats').addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const k = a.dataset.action;
    if (k === 'next') goTo(S.step + 1);
    else if (k === 'hint') { M.hint = Math.min(3, M.hint + 1); renderCard(); renderMail(); }
    else if (k === 'solution') showSolution();
    return;
  }
  if (e.target.closest('.more') || e.target.closest('.ref')) return;
  const past = e.target.closest('.beat.past');
  if (past) goTo(+past.dataset.goto);
});
$('timeline').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b && !b.disabled) goTo(+b.dataset.goto); });
$('theory-nav').addEventListener('click', e => {
  if (e.target.closest('#nav-prev')) goTo(S.step - 1);
  if (e.target.closest('#nav-next')) goTo(S.step + 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M.page) { M.page = null; renderMail(); return; }
  if (e.target.closest && e.target.closest('input, textarea, select, .mail')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') goTo(S.step + 1);
  if (e.key === 'ArrowLeft') goTo(S.step - 1);
});
const onMQ = () => { renderCard(); renderTransport(); };
mobileMQ.addEventListener ? mobileMQ.addEventListener('change', onMQ) : mobileMQ.addListener(onMQ);

renderTheory(); renderCard(); renderStage(); renderTransport();
})();
</script>
</body>
</html>

# System Design course: Node on 127.0.0.1:3620 (systemd --user system-design-web
# of the app user). certbot --nginx adds TLS and the HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name system-design.oleksandr-antonenko.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # better-auth counts sign-in attempts per client by this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
